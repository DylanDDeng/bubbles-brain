<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch · Pocket Battle — SVG Animation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 30%, #232733 0%, #14161d 55%, #0b0c11 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;overflow:hidden;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .stage{position:relative;width:min(92vw,1040px)}
  /* screen glow spilling onto the desk */
  .stage::before{
    content:"";position:absolute;inset:8% 18%;border-radius:50%;
    background:radial-gradient(ellipse, rgba(120,200,255,.16), transparent 70%);
    filter:blur(30px);
    animation:glowPulse 12s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes glowPulse{
    0%,24%,34%,54%,62%,100%{opacity:.8}
    26%,29%{opacity:1.6}   /* thunder flash */
    56%,59%{opacity:1.3}   /* flame hit */
  }
  svg{display:block;width:100%;height:auto}
  .caption{color:#5d6470;font-size:12px;letter-spacing:.28em;text-transform:uppercase}
  .caption b{color:#9aa3b2;font-weight:600}

  /* ============ master timeline: 12s ============ */
  .float{animation:float 7s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  /* ---- creatures ---- */
  .enemy{animation:enemyAct 12s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes enemyAct{
    0%{transform:translate(240px,-10px);opacity:0}
    6%{transform:translate(0,0);opacity:1}
    24%,49%{transform:translate(0,0)}
    27%,31%{transform:translate(0,0)}        /* gets hit (blink handled below) */
    52%{transform:translate(0,0)}
    54%{transform:translate(-225px,95px) rotate(-14deg)}  /* flame dash */
    58%{transform:translate(0,0)}
    74%,100%{transform:translate(0,0);opacity:1}
  }
  .enemyBody{animation:enemyBlink 12s steps(1) infinite, bob 1.6s ease-in-out infinite}
  @keyframes enemyBlink{
    0%,26%{opacity:1}
    26.8%{opacity:.15}27.6%{opacity:1}28.4%{opacity:.15}29.2%{opacity:1}30%{opacity:.15}31%,100%{opacity:1}
  }
  .player{animation:playerAct 12s ease-in-out infinite}
  @keyframes playerAct{
    0%,21%{transform:translate(0,0)}
    23%{transform:translate(36px,-20px)}     /* tackle lunge */
    26%{transform:translate(0,0)}
    55%,100%{transform:translate(0,0)}
  }
  .playerBody{animation:playerBlink 12s steps(1) infinite, bob 2s ease-in-out infinite}
  @keyframes playerBlink{
    0%,55.5%{opacity:1}
    56.3%{opacity:.15}57.1%{opacity:1}57.9%{opacity:.15}58.7%{opacity:1}59.5%{opacity:.15}60.3%,100%{opacity:1}
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  /* ---- effects ---- */
  .bolt{opacity:0;animation:bolt 12s linear infinite}
  @keyframes bolt{
    0%,24.5%{opacity:0}
    25%{opacity:1}26%{opacity:0}26.5%{opacity:1}27.5%{opacity:0}28%{opacity:1}
    29.5%,100%{opacity:0}
  }
  .flash{opacity:0;animation:flash 12s linear infinite}
  @keyframes flash{
    0%,25.5%{opacity:0}26.2%{opacity:.55}27%{opacity:0}
    55.5%{opacity:0}56.2%{opacity:.45}57%{opacity:0}
    100%{opacity:0}
  }
  .streak{opacity:0;animation:streak 12s linear infinite}
  @keyframes streak{0%,52.5%{opacity:0}53.5%{opacity:.9}57%{opacity:0}100%{opacity:0}}
  .shake{animation:shake 12s linear infinite}
  @keyframes shake{
    0%,55.8%{transform:translate(0,0)}
    56.2%{transform:translate(-5px,3px)}56.6%{transform:translate(5px,-3px)}
    57%{transform:translate(-4px,-2px)}57.4%{transform:translate(3px,2px)}
    57.8%{transform:translate(0,0)}100%{transform:translate(0,0)}
  }

  /* ---- HP bars (drain + color shift) ---- */
  .hpEnemy{transform-box:fill-box;transform-origin:left center;animation:hpEnemy 12s ease-out infinite}
  @keyframes hpEnemy{
    0%,28%{transform:scaleX(1)}
    34%,100%{transform:scaleX(.44)}
  }
  .hpPlayer{transform-box:fill-box;transform-origin:left center;animation:hpPlayer 12s ease-out infinite}
  @keyframes hpPlayer{
    0%,58%{transform:scaleX(1)}
    64%,100%{transform:scaleX(.62)}
  }

  /* ---- battle text ---- */
  .t1{animation:t1 12s steps(1) infinite}
  @keyframes t1{0%{opacity:0}4%{opacity:1}19%{opacity:1}20%,100%{opacity:0}}
  .t2{animation:t2 12s steps(1) infinite}
  @keyframes t2{0%,20%{opacity:0}21%{opacity:1}46%{opacity:1}47%,100%{opacity:0}}
  .t3{animation:t3 12s steps(1) infinite}
  @keyframes t3{0%,47%{opacity:0}48%{opacity:1}72%{opacity:1}73%,100%{opacity:0}}
  .t4{animation:t4 12s steps(1) infinite}
  @keyframes t4{0%,73%{opacity:0}74%{opacity:1}99%{opacity:1}100%{opacity:0}}
  .menu{animation:menuShow 12s steps(1) infinite}
  @keyframes menuShow{0%,73%{opacity:0}74%,99%{opacity:1}100%{opacity:0}}
  .cursor{animation:cursorBlink .9s steps(1) infinite}
  @keyframes cursorBlink{0%,55%{opacity:1}56%,100%{opacity:0}}
  .advance{animation:advBlink 1.1s ease-in-out infinite}
  @keyframes advBlink{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

  /* ---- console reactions ---- */
  .btnA{transform-box:fill-box;transform-origin:center;animation:pressA 12s ease-in-out infinite}
  @keyframes pressA{
    0%,20.5%{transform:scale(1)}21.5%{transform:scale(.82)}23%{transform:scale(1)}
    73.5%{transform:scale(1)}74.5%{transform:scale(.82)}76%{transform:scale(1)}
    100%{transform:scale(1)}
  }
  .stickL{transform-box:fill-box;transform-origin:center;animation:stickL 12s ease-in-out infinite}
  @keyframes stickL{
    0%,50%{transform:translate(0,0)}53%{transform:translate(-4px,3px)}57%{transform:translate(0,0)}
    100%{transform:translate(0,0)}
  }
  .led{animation:led 3s ease-in-out infinite}
  @keyframes led{0%,100%{opacity:.5}50%{opacity:1}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important}
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1100 520" role="img" aria-label="Nintendo Switch playing a pocket-monster style battle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f0"/><stop offset="1" stop-color="#d8f0e0"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc46a"/><stop offset="1" stop-color="#4f9a4e"/>
    </linearGradient>
    <linearGradient id="jcBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ed3ef"/><stop offset="1" stop-color="#00a8cc"/>
    </linearGradient>
    <linearGradient id="jcRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5e66"/><stop offset="1" stop-color="#e23440"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33343a"/><stop offset="1" stop-color="#1f2025"/>
    </linearGradient>
    <linearGradient id="hpbox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f4e2"/><stop offset="1" stop-color="#e9e2c8"/>
    </linearGradient>
    <radialGradient id="stickG" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#4a4c54"/><stop offset="1" stop-color="#222329"/>
    </radialGradient>
    <clipPath id="screenClip"><rect x="265" y="105" width="570" height="310" rx="6"/></clipPath>
  </defs>

  <!-- desk shadow -->
  <ellipse cx="550" cy="486" rx="430" ry="26" fill="#000" opacity="0.42"/>

  <g class="float">
    <!-- joy-cons -->
    <rect x="58" y="70" width="200" height="380" rx="82" fill="url(#jcBlue)"/>
    <rect x="842" y="70" width="200" height="380" rx="82" fill="url(#jcRed)"/>
    <rect x="58" y="70" width="200" height="380" rx="82" fill="none" stroke="#0008" stroke-width="2"/>
    <rect x="842" y="70" width="200" height="380" rx="82" fill="none" stroke="#0008" stroke-width="2"/>

    <!-- console body + bezel -->
    <rect x="228" y="70" width="644" height="380" fill="url(#bodyG)"/>
    <rect x="228" y="70" width="644" height="380" fill="none" stroke="#000" stroke-width="2" opacity=".5"/>
    <rect x="246" y="86" width="608" height="348" rx="10" fill="#0a0b0e"/>

    <!-- ===================== GAME SCREEN ===================== -->
    <g clip-path="url(#screenClip)">
      <g class="shake">
        <rect x="265" y="105" width="570" height="310" fill="url(#sky)"/>
        <rect x="265" y="245" width="570" height="170" fill="url(#grass)"/>
        <!-- distant hills -->
        <ellipse cx="380" cy="252" rx="190" ry="38" fill="#6db467" opacity=".7"/>
        <ellipse cx="760" cy="256" rx="220" ry="44" fill="#63aa5e" opacity=".6"/>

        <g transform="translate(265,105)">
          <!-- platforms -->
          <ellipse cx="420" cy="152" rx="100" ry="22" fill="#bcd98e"/>
          <ellipse cx="420" cy="152" rx="100" ry="22" fill="none" stroke="#93b96a" stroke-width="3"/>
          <ellipse cx="135" cy="272" rx="118" ry="26" fill="#bcd98e"/>
          <ellipse cx="135" cy="272" rx="118" ry="26" fill="none" stroke="#93b96a" stroke-width="3"/>

          <!-- ENEMY: Emberly, original fire-cub -->
          <g class="enemy">
            <g transform="translate(420,118)">
            <g class="enemyBody">
              <!-- flame tail -->
              <path d="M 24 -2 Q 52 -10 46 -34 Q 44 -18 34 -16 Q 40 -30 30 -40 Q 32 -22 20 -14 Z" fill="#f5a13c"/>
              <path d="M 28 -8 Q 42 -14 38 -28 Q 32 -16 26 -12 Z" fill="#ffd96b"/>
              <!-- body -->
              <ellipse cx="0" cy="6" rx="27" ry="20" fill="#e8853c"/>
              <ellipse cx="0" cy="14" rx="16" ry="10" fill="#f7c98f"/>
              <!-- legs -->
              <rect x="-18" y="18" width="7" height="12" rx="3" fill="#d3722e"/>
              <rect x="8" y="18" width="7" height="12" rx="3" fill="#d3722e"/>
              <!-- head -->
              <circle cx="-20" cy="-14" r="17" fill="#e8853c"/>
              <path d="M -32 -24 L -36 -42 L -22 -30 Z" fill="#e8853c"/>
              <path d="M -18 -28 L -14 -45 L -4 -30 Z" fill="#e8853c"/>
              <path d="M -30 -27 L -32 -36 L -25 -30 Z" fill="#ffd96b"/>
              <circle cx="-26" cy="-15" r="2.6" fill="#33241c"/>
              <circle cx="-13" cy="-13" r="2.6" fill="#33241c"/>
              <ellipse cx="-20" cy="-7" rx="3.4" ry="2.2" fill="#a8502a"/>
              <circle cx="-31" cy="-8" r="3" fill="#f5a86c" opacity=".8"/>
            </g>
            </g>
          </g>

          <!-- PLAYER: Axolt, original water-axolotl (back view) -->
          <g class="player">
            <g transform="translate(135,242)">
            <g class="playerBody">
              <ellipse cx="0" cy="0" rx="46" ry="33" fill="#4aa8b8"/>
              <ellipse cx="0" cy="-6" rx="40" ry="24" fill="#5cbcca"/>
              <!-- dorsal fin -->
              <path d="M -4 -32 Q 0 -56 14 -60 Q 6 -44 10 -30 Z" fill="#2f7e8e"/>
              <!-- gill frills -->
              <circle cx="-42" cy="-14" r="8" fill="#f08aa0"/>
              <circle cx="-48" cy="-2" r="6.4" fill="#f08aa0"/>
              <circle cx="42" cy="-14" r="8" fill="#f08aa0"/>
              <circle cx="48" cy="-2" r="6.4" fill="#f08aa0"/>
              <!-- tail tip -->
              <path d="M 34 16 Q 56 22 60 36 Q 42 32 30 26 Z" fill="#3a93a4"/>
            </g>
            </g>
          </g>

          <!-- thunder jolt effect -->
          <g class="bolt">
            <polyline points="430,12 408,58 432,62 402,112" fill="none" stroke="#ffd933" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="430,12 408,58 432,62 402,112" fill="none" stroke="#fff6c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="420" cy="118" r="38" fill="none" stroke="#ffd933" stroke-width="4" opacity=".8"/>
            <circle cx="420" cy="118" r="52" fill="none" stroke="#ffd933" stroke-width="2" opacity=".4"/>
          </g>

          <!-- flame dash streaks -->
          <g class="streak" stroke-linecap="round">
            <line x1="392" y1="128" x2="230" y2="196" stroke="#ff9c3c" stroke-width="9" opacity=".85"/>
            <line x1="408" y1="148" x2="252" y2="216" stroke="#ffc36b" stroke-width="6"/>
            <line x1="376" y1="112" x2="216" y2="180" stroke="#ffe09a" stroke-width="4"/>
          </g>

          <!-- enemy HP box -->
          <g font-family="'Courier New',monospace" font-weight="bold">
            <rect x="18" y="20" width="212" height="58" rx="9" fill="url(#hpbox)" stroke="#5a5648" stroke-width="3"/>
            <text x="32" y="44" font-size="17" fill="#3a362c">EMBERLY</text>
            <text x="196" y="44" font-size="14" fill="#3a362c" text-anchor="end">Lv18</text>
            <text x="34" y="66" font-size="11" fill="#e8853c">HP</text>
            <rect x="58" y="56" width="150" height="11" rx="5.5" fill="#46423a"/>
            <rect x="60" y="58" width="146" height="7" rx="3.5" fill="#58d068" class="hpEnemy"/>
          </g>

          <!-- player HP box -->
          <g font-family="'Courier New',monospace" font-weight="bold">
            <rect x="338" y="178" width="216" height="58" rx="9" fill="url(#hpbox)" stroke="#5a5648" stroke-width="3"/>
            <text x="352" y="202" font-size="17" fill="#3a362c">AXOLT</text>
            <text x="540" y="202" font-size="14" fill="#3a362c" text-anchor="end">Lv20</text>
            <text x="354" y="224" font-size="11" fill="#4aa8b8">HP</text>
            <rect x="378" y="214" width="150" height="11" rx="5.5" fill="#46423a"/>
            <rect x="380" y="216" width="146" height="7" rx="3.5" fill="#58d068" class="hpPlayer"/>
          </g>

          <!-- text box -->
          <g font-family="'Courier New',monospace" font-weight="bold">
            <rect x="12" y="246" width="546" height="58" rx="8" fill="#26324c" stroke="#e9e2c8" stroke-width="3"/>
            <text class="t1" x="30" y="281" font-size="17" fill="#f4f0e0">A wild EMBERLY appeared!</text>
            <text class="t2" x="30" y="281" font-size="17" fill="#f4f0e0">AXOLT used THUNDER JOLT!</text>
            <text class="t3" x="30" y="281" font-size="17" fill="#f4f0e0">EMBERLY used FLAME DASH!</text>
            <text class="t4" x="30" y="281" font-size="17" fill="#f4f0e0">What will AXOLT do?</text>
            <g class="advance"><path d="M 536 292 l 10 0 l -5 7 z" fill="#f4f0e0"/></g>
          </g>

          <!-- command menu -->
          <g class="menu" font-family="'Courier New',monospace" font-weight="bold" font-size="15">
            <rect x="356" y="246" width="202" height="58" rx="8" fill="#f8f4e2" stroke="#5a5648" stroke-width="3"/>
            <text x="392" y="270" fill="#3a362c">FIGHT</text>
            <text x="478" y="270" fill="#3a362c">BAG</text>
            <text x="392" y="294" fill="#3a362c">PKMN</text>
            <text x="478" y="294" fill="#3a362c">RUN</text>
            <g class="cursor"><path d="M 376 260 l 10 5 l -10 5 z" fill="#e23440"/></g>
          </g>
        </g>

        <!-- impact flash -->
        <rect class="flash" x="265" y="105" width="570" height="310" fill="#fff"/>
        <!-- screen vignette -->
        <rect x="265" y="105" width="570" height="310" fill="none" stroke="#000" stroke-width="10" opacity=".18"/>
      </g>
    </g>
    <!-- screen glass reflection -->
    <path d="M 265 105 L 520 105 L 340 415 L 265 415 Z" fill="#fff" opacity="0.045"/>

    <!-- ===================== CONTROLS ===================== -->
    <!-- left joy-con -->
    <rect x="96" y="106" width="22" height="6" rx="3" fill="#1b1c20"/>            <!-- minus -->
    <g class="stickL">
      <circle cx="158" cy="186" r="34" fill="url(#stickG)" stroke="#101114" stroke-width="3"/>
      <circle cx="158" cy="186" r="22" fill="#2c2d33"/>
      <circle cx="158" cy="178" r="9" fill="#3a3b42" opacity=".8"/>
    </g>
    <g fill="#1b1c20">
      <circle cx="158" cy="282" r="12"/><circle cx="158" cy="336" r="12"/>
      <circle cx="131" cy="309" r="12"/><circle cx="185" cy="309" r="12"/>
    </g>
    <g fill="#caccd4" font-family="sans-serif" font-size="11" text-anchor="middle">
      <text x="158" y="286">▲</text><text x="158" y="341">▼</text>
      <text x="131" y="313">◀</text><text x="185" y="313">▶</text>
    </g>
    <rect x="146" y="382" width="24" height="20" rx="5" fill="#1b1c20"/>
    <circle cx="158" cy="392" r="5" fill="#0d0e11"/>                              <!-- capture -->

    <!-- right joy-con -->
    <g transform="translate(972,112)">
      <rect x="-11" y="-3" width="22" height="6" rx="3" fill="#1b1c20"/>
      <rect x="-3" y="-11" width="6" height="22" rx="3" fill="#1b1c20"/>          <!-- plus -->
    </g>
    <g fill="#1b1c20">
      <circle cx="942" cy="166" r="12"/>            <!-- X -->
      <circle cx="942" cy="220" r="12"/>            <!-- B -->
      <circle cx="915" cy="193" r="12"/>            <!-- Y -->
    </g>
    <circle class="btnA" cx="969" cy="193" r="12" fill="#1b1c20"/>                <!-- A -->
    <g fill="#caccd4" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      <text x="942" y="170">X</text><text x="942" y="224">B</text>
      <text x="915" y="197">Y</text><text class="btnA" x="969" y="197">A</text>
    </g>
    <circle cx="942" cy="300" r="34" fill="url(#stickG)" stroke="#101114" stroke-width="3"/>
    <circle cx="942" cy="300" r="22" fill="#2c2d33"/>
    <circle cx="942" cy="292" r="9" fill="#3a3b42" opacity=".8"/>
    <circle cx="942" cy="380" r="13" fill="#1b1c20" stroke="#caccd4" stroke-width="2"/>
    <rect x="936" y="374" width="12" height="12" rx="2.5" fill="none" stroke="#caccd4" stroke-width="1.6"/>

    <!-- power led -->
    <circle class="led" cx="250" cy="78" r="2.6" fill="#58d068"/>
  </g>
</svg>
</div>
<div class="caption"><b>SWITCH · POCKET BATTLE</b> &nbsp;—&nbsp; one-file SVG animation · original creatures, fan homage</div>
</body>
</html>
