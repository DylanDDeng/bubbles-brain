<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MacBook Pro — 360° Draggable SVG</title>
<style>
:root{--fg:#ececf1;--mut:#8d8d96}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 42%,#2b2b35 0%,#131318 55%,#060607 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:var(--fg);-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;display:block}
#stage.drag{cursor:grabbing}
#mesh polygon{stroke-width:.5;stroke-linejoin:round}
header{position:fixed;top:26px;left:0;right:0;text-align:center;pointer-events:none}
h1{font-size:clamp(24px,3.4vw,42px);font-weight:600;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#9b9ba5);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin-top:6px;color:var(--mut);font-size:13px;letter-spacing:.02em}
.panel{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:18px;background:rgba(32,32,40,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
button{font:inherit;font-size:13px;color:var(--fg);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);padding:7px 13px;border-radius:11px;cursor:pointer;transition:background .2s}
button:hover{background:rgba(255,255,255,.16)}
button.on{background:rgba(10,132,255,.35);border-color:rgba(10,132,255,.6)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;outline:1px solid rgba(255,255,255,.25)}
.sw.sel{border-color:#0a84ff}
.lbl{font-size:12px;color:var(--mut)}
input[type=range]{width:120px;accent-color:#0a84ff}
.sep{width:1px;height:22px;background:rgba(255,255,255,.12)}
#hud{position:fixed;right:16px;top:14px;font:11px ui-monospace,Menlo,monospace;color:#6f6f78;text-align:right;pointer-events:none}
</style>
</head>
<body>
<svg id="stage" viewBox="-500 -330 1000 660" preserveAspectRatio="xMidYMid meet">
  <defs id="defs">
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <g id="shadow" filter="url(#blur)" fill="#000">
    <polygon id="shBase"/><polygon id="shLid"/>
  </g>
  <g id="mesh"></g>
</svg>

<header>
  <h1>MacBook Pro</h1>
  <p>Drag to rotate 360° · Scroll / pinch to zoom · Double‑click to open or close</p>
</header>
<div id="hud"></div>

<div class="panel">
  <button id="lidBtn">Close Lid</button>
  <span class="lbl">Lid</span><input id="lidRange" type="range" min="0" max="135" value="0">
  <span class="sep"></span>
  <button class="sw sel" id="swSilver" title="Silver" style="background:linear-gradient(135deg,#f0f0f2,#b9bbbf)"></button>
  <button class="sw" id="swBlack" title="Space Black" style="background:linear-gradient(135deg,#55565b,#1c1c1f)"></button>
  <span class="sep"></span>
  <button id="autoBtn" class="on">Auto‑rotate</button>
  <button id="resetBtn">Reset</button>
</div>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const svg=$('stage'),mesh=$('mesh'),shBase=$('shBase'),shLid=$('shLid'),shadowG=$('shadow');

/* ---------- dimensions (mm) ---------- */
const BW=312,BD=220,BH=10,BR=11,LL=218,LT=4.6,HY=BH,HZ=-BD/2;

/* ---------- materials ---------- */
const THEMES={
  silver:{alu:[206,208,212],key:[24,24,26],well:[10,10,11],pad:[196,198,203],logo:[240,241,244],port:[16,16,18],hinge:[42,42,46],foot:[70,70,74]},
  black:{alu:[50,51,55],key:[15,15,17],well:[6,6,7],pad:[58,59,63],logo:[96,98,104],port:[7,7,8],hinge:[24,24,26],foot:[20,20,22]}
};
let theme='silver';
const M={
  alu:{k:'alu',a:.45,d:.62,s:.5,sh:24},
  aluD:{k:'alu',a:.33,d:.45,s:.15,sh:10},
  pad:{k:'pad',a:.5,d:.58,s:.4,sh:40},
  key:{k:'key',a:.9,d:.35,s:.1,sh:8},
  tid:{k:'key',a:.7,d:.3,s:.45,sh:30},
  well:{k:'well',a:1,d:.2,s:.04,sh:8},
  port:{k:'port',a:1,d:.1,s:0,sh:1},
  hinge:{k:'hinge',a:.8,d:.4,s:.25,sh:16},
  foot:{k:'foot',a:.9,d:.3,s:.1,sh:6},
  logo:{k:'logo',a:.5,d:.55,s:.9,sh:50},
  glass:{c:[9,9,11],a:1,d:.25,s:.55,sh:70},
  cam:{c:[20,26,44],a:1,d:.2,s:.9,sh:80}
};
const norm=v=>{const l=Math.hypot(v[0],v[1],v[2]);return[v[0]/l,v[1]/l,v[2]/l]};
const LV=norm([-.4,.72,.56]),HV=norm([LV[0],LV[1],LV[2]+1]);
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function shadeArr(m,n){
  const c=m.c||THEMES[theme][m.k];
  const lam=Math.max(0,dot(n,LV)),h=Math.max(0,dot(n,HV));
  const sp=Math.pow(h,m.sh)*m.s*255,k=m.a+m.d*lam;
  return[c[0]*k+sp,c[1]*k+sp,c[2]*k+sp];
}
const cl=v=>v<0?0:v>255?255:v|0;
const rgb=c=>`rgb(${cl(c[0])},${cl(c[1])},${cl(c[2])})`;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

/* ---------- 2D shape helpers ---------- */
function rrect(x0,y0,x1,y1,r,seg=3){
  r=Math.max(0,Math.min(r,(x1-x0)/2,(y1-y0)/2));
  const c=[[x1-r,y1-r,0],[x0+r,y1-r,90],[x0+r,y0+r,180],[x1-r,y0+r,270]],p=[];
  for(const[cx,cy,a]of c)for(let i=0;i<=seg;i++){const t=(a+90*i/seg)*Math.PI/180;p.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}
  return p;
}
function circ(cx,cy,r,n=16){const p=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;p.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}return p;}

/* extrude a convex 2D outline (a,b) along h */
function extrude(out,map,h0,h1,n0,n1,sn,mat,w,d){
  const bottom={pts:out.map(([a,b])=>map(a,b,h0)),n:n0,m:mat,dec:[]};
  const top={pts:out.map(([a,b])=>map(a,b,h1)),n:n1,m:mat,dec:[]};
  const sides=[],tags={},e=1e-4;
  for(let i=0;i<out.length;i++){
    const p=out[i],q=out[(i+1)%out.length];
    let na=q[1]-p[1],nb=-(q[0]-p[0]);
    if(na*(p[0]+q[0])+nb*(p[1]+q[1])<0){na=-na;nb=-nb;}
    const l=Math.hypot(na,nb)||1;na/=l;nb/=l;
    const f={pts:[map(p[0],p[1],h1),map(q[0],q[1],h1),map(q[0],q[1],h0),map(p[0],p[1],h0)],n:sn(na,nb),m:mat,dec:[]};
    if(Math.abs(p[0]-q[0])<e&&Math.abs(Math.abs(p[0])-w/2)<e)tags[p[0]>0?'+a':'-a']=f;
    if(Math.abs(p[1]-q[1])<e&&Math.abs(Math.abs(p[1])-d/2)<e)tags[p[1]>0?'+b':'-b']=f;
    sides.push(f);
  }
  return{top,bottom,sides,tags,faces:[top,bottom,...sides]};
}

/* ================= BASE ================= */
const baseOut=rrect(-BW/2,-BD/2,BW/2,BD/2,BR,8);
const base=extrude(baseOut,(a,b,h)=>[a,h,b],0,BH,[0,-1,0],[0,1,0],(na,nb)=>[na,0,nb],M.alu,BW,BD);
const baseObj={faces:base.faces,xf:p=>p,nx:n=>n};

const onTop=pts=>pts.map(([x,z])=>[x,BH,z]);
const T=base.top.dec;
// keyboard
const U=17,KW=15*U,KX0=-KW/2,KZ0=-96,GAP=1.7;
const ones=n=>Array(n).fill(1);
const rows=[
  {h:.62,k:[1.5,...ones(12),1.5],tid:true},
  {h:1,k:[...ones(13),2]},
  {h:1,k:[1.5,...ones(12),1.5]},
  {h:1,k:[1.8,...ones(11),2.2]},
  {h:1,k:[2.3,...ones(10),2.7]},
  {h:1,k:[1,1,1,1.25,5.5,1.25,1,'arrows']}
];
let kz=KZ0;
const keys=[];
for(const row of rows){
  const hz=row.h*U;let x=KX0;
  row.k.forEach((w,i)=>{
    if(w==='arrows'){
      const hh=hz/2;
      const k=(x0,z0,x1,z1)=>keys.push({pts:onTop(rrect(x0+GAP/2,z0+GAP/2,x1-GAP/2,z1-GAP/2,1.4,2)),m:M.key});
      k(x,kz+hh,x+U,kz+hz);k(x+U,kz,x+2*U,kz+hh);k(x+U,kz+hh,x+2*U,kz+hz);k(x+2*U,kz+hh,x+3*U,kz+hz);
      x+=3*U;return;
    }
    const isTid=row.tid&&i===row.k.length-1;
    keys.push({pts:onTop(rrect(x+GAP/2,kz+GAP/2,x+w*U-GAP/2,kz+hz-GAP/2,1.6,2)),m:isTid?M.tid:M.key});
    x+=w*U;
  });
  kz+=hz;
}
const KZ1=kz;
T.push({pts:onTop(rrect(KX0-2.6,KZ0-2.6,-KX0+2.6,KZ1+2.6,3.5,3)),m:M.well});
T.push(...keys);
// speaker grilles
for(const sgn of[-1,1]){
  for(let c=0;c<3;c++)for(let r=0;r<24;r++){
    const x=sgn*(KW/2+9+c*3.6),z=KZ0+2+r*((KZ1-KZ0-4)/23);
    T.push({pts:onTop([[x-.65,z-.65],[x+.65,z-.65],[x+.65,z+.65],[x-.65,z+.65]]),m:M.well,o:.8});
  }
}
// trackpad
T.push({pts:onTop(rrect(-68,12.5,68,99.5,5,4)),m:M.pad});

// bottom: feet
for(const[x,z]of[[-128,-88],[128,-88],[-128,88],[128,88]])
  base.bottom.dec.push({pts:circ(x,z,7,18).map(([a,b])=>[a,0,b]),m:M.foot});
// back: hinge
base.tags['-b'].dec.push({pts:rrect(-122,1.2,122,8.8,2.5,3).map(([x,y])=>[x,y,-BD/2]),m:M.hinge});
// front: thumb scoop
base.tags['+b'].dec.push({pts:[[-26,BH],[26,BH],...Array.from({length:13},(_,i)=>{const t=i/12*Math.PI;return[26*Math.cos(t),BH-2.6*Math.sin(t)]})].map(([x,y])=>[x,y,BD/2]),m:M.aluD});
// left ports (MagSafe, 2x Thunderbolt, headphone)
const L=base.tags['-a'].dec,Rt=base.tags['+a'].dec;
const onL=pts=>pts.map(([z,y])=>[-BW/2,y,z]),onR=pts=>pts.map(([z,y])=>[BW/2,y,z]);
L.push({pts:onL(rrect(-82,3.2,-64,6.8,1.8,3)),m:M.port});
L.push({pts:onL(rrect(-54,3.3,-45,6.7,1.7,3)),m:M.port});
L.push({pts:onL(rrect(-39,3.3,-30,6.7,1.7,3)),m:M.port});
L.push({pts:onL(circ(62,5,1.9,14)),m:M.port});
// right ports (SD, Thunderbolt, HDMI)
Rt.push({pts:onR(rrect(-72,4.2,-48,5.8,.8,2)),m:M.port});
Rt.push({pts:onR(rrect(-30,3.3,-21,6.7,1.7,3)),m:M.port});
Rt.push({pts:onR([[38,6.9],[54,6.9],[54,4.4],[52.2,3.1],[39.8,3.1],[38,4.4]]),m:M.port});

/* ================= LID ================= */
const lidOut=rrect(-BW/2,-LL/2,BW/2,LL/2,10,8);
const lid=extrude(lidOut,(a,b,h)=>[a,b+LL/2,h],0,LT,[0,0,-1],[0,0,1],(na,nb)=>[na,nb,0],M.alu,BW,LL);
const lidObj={faces:lid.faces,xf:null,nx:null};
const I=lid.bottom.dec; // inner (screen) face, v=0
const inner=pts=>pts.map(([x,u])=>[x,u,0]);
I.push({pts:inner(rrect(-BW/2+1.6,1.6,BW/2-1.6,LL-1.6,9,5)),m:M.glass});

// display coordinates
const DX0=-150,DW=300,DU1=LL-8,DH=DU1-16;
const S=(sx,sy)=>[DX0+sx*DW,DU1-sy*DH,0];
const SR=(sx0,sy0,sx1,sy1,r=0,seg=3)=>inner(rrect(DX0+sx0*DW,DU1-sy1*DH,DX0+sx1*DW,DU1-sy0*DH,r,seg));
const SC=(sx,sy,r,n=12)=>inner(circ(DX0+sx*DW,DU1-sy*DH,r,n));
const E=(pts,col,o=1,vis)=>I.push({pts,e:typeof col==='string'?hex(col):col,o,vis});

// wallpaper — layered waves
const band=['#0d1238','#1f1f66','#3d2a95','#7a2f9f','#c43e84','#ef6a5c','#ffad62','#ffd08a'];
E(SR(0,0,1,1),band[0]);
for(let k=1;k<band.length;k++){
  const pts=[],b=.06+k*.11,amp=.05+.02*(k%3),f=3.2+k*.7,ph=k*1.9;
  for(let i=0;i<=30;i++){const sx=i/30;let sy=b+amp*Math.sin(sx*f+ph)+.025*Math.sin(sx*11+k);sy=Math.max(0,Math.min(1,sy));pts.push(S(sx,sy));}
  pts.push(S(1,1),S(0,1));
  E(pts,band[k]);
}
// finder-like window
E(SR(.455,.215,.895,.685,2.5),[0,0,0],.28);
E(SR(.44,.2,.88,.67,2.5),'#f7f7f9');
E(SR(.44,.2,.53,.67,2.5),'#e3e4ea');
E(SR(.44,.2,.88,.24,2.5),'#e9e9ed');
[['#ff5f57',.452],['#febc2e',.466],['#28c840',.48]].forEach(([c,x])=>E(SC(x,.22,1.25),c));
const thumbs=['#5ac8fa','#ff9f0a','#bf5af2','#30d158','#ff375f','#64d2ff'];
thumbs.forEach((c,i)=>{const cx=i%3,cy=(i/3)|0;const x0=.55+cx*.108,y0=.28+cy*.19;E(SR(x0,y0,x0+.092,y0+.16,1.8),c);E(SR(x0+.015,y0+.11,x0+.077,y0+.14,.8),'#ffffff',.55);});
for(let i=0;i<6;i++)E(SR(.452,.28+i*.05,.515,.295+i*.05,.6),'#9a9aa6',.8);
// terminal window
E(SR(.135,.145,.555,.615,2.5),[0,0,0],.35);
E(SR(.12,.13,.54,.6,2.5),'#1c1c24',.96);
E(SR(.12,.13,.54,.17,2.5),'#2d2d36');
[['#ff5f57',.132],['#febc2e',.146],['#28c840',.16]].forEach(([c,x])=>E(SC(x,.15,1.25),c));
const tcol=['#32d74b','#e5e5ea','#64d2ff','#ff7ab2','#ffd60a','#8e8e98'];
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const NL=12,t0=performance.now();
const lineCount=()=>{const t=((performance.now()-t0)/1000)%14;return Math.min(NL,Math.floor(t/.55));};
for(let i=0;i<NL;i++){
  let x=.135;const y=.195+i*.032;
  const segs=i%4===0?[[.025,0],[.14+rnd()*.12,1]]:[[.05+rnd()*.08,2+(i%4)],[.04+rnd()*.1,1+((i*3)%5)]];
  segs.forEach(([w,c])=>{E(SR(x,y,Math.min(.525,x+w),y+.013,.4,1),tcol[c%tcol.length],1,()=>lineCount()>i);x+=w+.012;});
  E(SR(.135,y,.143,y+.016,0,0),'#e5e5ea',.9,()=>lineCount()===i&&((performance.now()/500)|0)%2===0);
}
// dock
E(SR(.25,.9,.75,.978,3.2),'#ffffff',.24);
const dockC=['#1e90ff','#34c759','#ff9500','#ff2d55','#af52de','#5ac8fa','#ffcc00','#8e8e93','#ff3b30','#30b0c7','#ffffff','#5856d6'];
dockC.forEach((c,i)=>{const cx=.275+i*(.45/11);const hw=4.6/DW,hh=4.6/DH;E(SR(cx-hw,.939-hh,cx+hw,.939+hh,2.2),c);});
// menu bar
E(SR(0,0,1,.034),'#ffffff',.16);
E(SR(.012,.01,.02,.024,.6),'#ffffff',.95);
[.03,.055,.075,.098,.12].forEach((x,i)=>E(SR(x,.012,x+(i?.016:.022),.022,.4),'#ffffff',.85));
[.82,.845,.87,.9,.94].forEach((x,i)=>E(SR(x,.012,x+(i===4?.045:.013),.022,.4),'#ffffff',.85));
// notch + camera
I.push({pts:inner(rrect(-16,DU1-6.5,16,DU1+4,2.6,4)),m:M.glass});
I.push({pts:inner(circ(0,DU1-2.8,1.1,12)),m:M.cam});
// glass glare
I.push({pts:[S(.5,0),S(.78,0),S(.34,1),S(.06,1)],glare:true});

// lid back: logo
const LOGO_BODY='M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09z';
const LOGO_LEAF='M15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701z';
function samplePath(d,n){
  const p=document.createElementNS(NS,'path');p.setAttribute('d',d);$('defs').appendChild(p);
  const len=p.getTotalLength(),o=[];
  for(let i=0;i<n;i++){const q=p.getPointAtLength(len*i/n);o.push([q.x,q.y]);}
  p.remove();return o;
}
const LS=1.75,toBack=pts=>pts.map(([x,y])=>[-(x-12)*LS,LL/2-(y-12)*LS,LT]);
lid.top.dec.push({pts:toBack(samplePath(LOGO_BODY,120)),m:M.logo});
lid.top.dec.push({pts:toBack(samplePath(LOGO_LEAF,40)),m:M.logo});

/* ================= VIEW / STATE ================= */
let yaw=-2.6,pitch=.32,zoom=1,lid_=0,lidTarget=0,auto=true;
let ca=1,sa=0,cb=1,sb=0,piv=[0,0,0],cam=[0,0,0],bright=0;
const D=1500,F=2350,OY=26;
function P(p){
  const x=p[0]-piv[0],y=p[1]-piv[1],z=p[2]-piv[2];
  const x1=x*ca+z*sa,z1=-x*sa+z*ca;
  const y2=y*cb-z1*sb,z2=y*sb+z1*cb;
  const s=F*zoom/(D-z2);
  return(x1*s).toFixed(1)+','+(OY-y2*s).toFixed(1);
}
function rotDir(n){
  const x1=n[0]*ca+n[2]*sa,z1=-n[0]*sa+n[2]*ca;
  return[x1,n[1]*cb-z1*sb,n[1]*sb+z1*cb];
}
const projPts=(obj,pts)=>{let s='';for(let i=0;i<pts.length;i++)s+=(i?' ':'')+P(obj.xf(pts[i]));return s;};

function drawObj(obj,out){
  for(const f of obj.faces){
    const nm=obj.nx(f.n),p0=obj.xf(f.pts[0]);
    if(nm[0]*(cam[0]-p0[0])+nm[1]*(cam[1]-p0[1])+nm[2]*(cam[2]-p0[2])<=0)continue; // back-face cull
    const nv=rotDir(nm);
    out.push({p:projPts(obj,f.pts),f:rgb(shadeArr(f.m,nv)),o:1});
    let off=null;
    for(const d of f.dec){
      if(d.vis&&!d.vis())continue;
      let col,o=d.o??1;
      if(d.e){off=off||shadeArr(M.glass,nv);col=mix(off,d.e,bright);}
      else if(d.glare){col=[255,255,255];o=(.03+.13*Math.pow(Math.max(0,dot(nv,HV)),3))*(.4+.6*bright);}
      else col=shadeArr(d.m,nv);
      out.push({p:projPts(obj,d.pts),f:rgb(col),o});
    }
  }
}

const pool=[];
function flush(list){
  while(pool.length<list.length){const el=document.createElementNS(NS,'polygon');mesh.appendChild(el);pool.push(el);}
  for(let i=0;i<pool.length;i++){
    const el=pool[i];
    if(i<list.length){
      const it=list[i];
      if(el._p!==it.p){el.setAttribute('points',it.p);el._p=it.p;}
      if(el._f!==it.f){el.setAttribute('fill',it.f);el._f=it.f;el._s=null;}
      const st=it.o>=1?it.f:'none';
      if(el._s!==st){el.setAttribute('stroke',st);el._s=st;}
      if(el._o!==it.o){el.setAttribute('fill-opacity',it.o);el._o=it.o;}
      if(el._h){el.style.display='';el._h=false;}
    }else if(!el._h){el.style.display='none';el._h=true;}
  }
}

/* ================= LOOP ================= */
const smooth=(x,a,b)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
let last=performance.now(),vy=0,vp=0,dragging=false,lastInteract=-1e9,hudT=0;
const hud=$('hud'),lidBtn=$('lidBtn'),lidRange=$('lidRange');

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  // motion
  if(!dragging){
    yaw+=vy;pitch+=vp;vy*=.94;vp*=.94;
    if(auto&&now-lastInteract>2500&&Math.abs(vy)<.002)yaw+=.38*dt;
  }
  lid_+=(lidTarget-lid_)*Math.min(1,dt*4.5);
  const th=lid_*Math.PI/180,s=Math.sin(th),c=Math.cos(th);
  lidObj.xf=p=>[p[0],HY+p[1]*s+p[2]*c,HZ+p[1]*c-p[2]*s];
  lidObj.nx=n=>[n[0],n[1]*s+n[2]*c,n[1]*c-n[2]*s];
  bright=smooth(lid_,25,80);

  // pivot = center of bounding box
  const tipY=HY+LL*s+LT*Math.abs(c),tipZ=HZ+LL*c;
  const maxY=Math.max(BH+LT,tipY),minZ=Math.min(-BD/2-LT,tipZ),maxZ=Math.max(BD/2,tipZ);
  piv=[0,maxY/2,(minZ+maxZ)/2];
  ca=Math.cos(yaw);sa=Math.sin(yaw);cb=Math.cos(pitch);sb=Math.sin(pitch);
  cam=[piv[0]-D*cb*sa,piv[1]+D*sb,piv[2]+D*cb*ca];

  // shadow on the floor
  const shOp=Math.max(0,Math.min(1,(cam[1]-BH)/450))*.6;
  shadowG.setAttribute('opacity',shOp.toFixed(3));
  if(shOp>0){
    shBase.setAttribute('points',baseOut.map(([x,z])=>P([x*1.03,-1,z*1.03])).join(' '));
    shLid.setAttribute('points',lidOut.map(([x,u])=>{const q=lidObj.xf([x,u+LL/2,LT]);return P([q[0],-1,q[2]]);}).join(' '));
  }

  // painter's order: the base-top plane (y=BH) separates base and lid
  const list=[];
  if(cam[1]>BH){drawObj(baseObj,list);drawObj(lidObj,list);}
  else{drawObj(lidObj,list);drawObj(baseObj,list);}
  flush(list);

  if(now-hudT>120){
    hudT=now;
    const deg=r=>((r*180/Math.PI)%360+540)%360-180;
    hud.textContent=`yaw ${deg(yaw).toFixed(0)}°  pitch ${deg(pitch).toFixed(0)}°  lid ${lid_.toFixed(0)}°  zoom ${zoom.toFixed(2)}×`;
    lidBtn.textContent=lidTarget>5?'Close Lid':'Open Lid';
    if(document.activeElement!==lidRange)lidRange.value=lidTarget;
  }
  requestAnimationFrame(frame);
}

/* ================= INPUT ================= */
const ptrs=new Map();let lx=0,ly=0,pinchD=0,pinchZ=1;
const clampZ=z=>Math.max(.45,Math.min(2.4,z));
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){dragging=true;lx=e.clientX;ly=e.clientY;vy=vp=0;svg.classList.add('drag');}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y)||1;pinchZ=zoom;}
  lastInteract=performance.now();
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  lastInteract=performance.now();
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];zoom=clampZ(pinchZ*Math.hypot(a.x-b.x,a.y-b.y)/pinchD);return;}
  if(!dragging)return;
  const k=.0085,dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  const dir=Math.cos(pitch)<0?-1:1; // keep horizontal drag intuitive when upside down
  vy=dx*k*dir;vp=dy*k;yaw+=vy;pitch+=vp;
});
const up=e=>{
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){dragging=false;svg.classList.remove('drag');}
  else{const r=[...ptrs.values()][0];lx=r.x;ly=r.y;}
  lastInteract=performance.now();
};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoom=clampZ(zoom*Math.exp(-e.deltaY*.0012));lastInteract=performance.now();},{passive:false});
const toggleLid=()=>{lidTarget=lidTarget>5?0:115;};
svg.addEventListener('dblclick',toggleLid);
window.addEventListener('keydown',e=>{
  const st=.12;
  if(e.key==='ArrowLeft')vy=-st*.3;else if(e.key==='ArrowRight')vy=st*.3;
  else if(e.key==='ArrowUp')vp=-st*.3;else if(e.key==='ArrowDown')vp=st*.3;
  else if(e.key==='o'||e.key==='O'||e.key===' '){toggleLid();e.preventDefault();}
  else return;
  lastInteract=performance.now();
});

lidBtn.onclick=toggleLid;
lidRange.oninput=()=>{lidTarget=+lidRange.value;};
const setTheme=t=>{theme=t;$('swSilver').classList.toggle('sel',t==='silver');$('swBlack').classList.toggle('sel',t==='black');};
$('swSilver').onclick=()=>setTheme('silver');
$('swBlack').onclick=()=>setTheme('black');
$('autoBtn').onclick=function(){auto=!auto;this.classList.toggle('on',auto);};
$('resetBtn').onclick=()=>{yaw=-.6;pitch=.32;zoom=1;vy=vp=0;lidTarget=115;lastInteract=performance.now();};

// intro: spin in and open the lid
vy=.045;
setTimeout(()=>{lidTarget=115;},500);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
