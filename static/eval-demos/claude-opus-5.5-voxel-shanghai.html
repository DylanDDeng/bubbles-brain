<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const loadText = $('loadText');
const tick = () => new Promise(r => setTimeout(r, 16));
const status = s => { loadText.textContent = s; };

/* =========================================================
   基础工具：随机数 / 哈希 / 颜色
   ========================================================= */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(19491001);
const ri = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];
function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z, s) {
  const X = Math.floor(x / s), Z = Math.floor(z / s), fx = x / s - X, fz = z / s - Z;
  const a = hash3(X, 3, Z), b = hash3(X + 1, 3, Z), c = hash3(X, 3, Z + 1), d = hash3(X + 1, 3, Z + 1);
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function cmul(c, f) {
  const r = Math.max(0, Math.min(255, ((c >> 16) & 255) * f | 0)), g = Math.max(0, Math.min(255, ((c >> 8) & 255) * f | 0)), b = Math.max(0, Math.min(255, (c & 255) * f | 0));
  return (r << 16) | (g << 8) | b;
}
function cmix(a, b, t) {
  const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255, br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
  return ((ar + (br - ar) * t) | 0) << 16 | ((ag + (bg - ag) * t) | 0) << 8 | ((ab + (bb - ab) * t) | 0);
}
const hpick = (arr, h) => arr[Math.floor(h * arr.length) % arr.length];
const WARM = [0xffcf7f, 0xffe2a8, 0xffd59a, 0xfff0cc], COOL = [0xcfe7ff, 0xb8dcff, 0xe6f3ff];
function winNight(h, onP = 0.62, cool = 0.25) {
  if (h > onP) return 0x07090f;
  const k = h / onP;
  return k < cool ? COOL[(k * 97 | 0) % 3] : WARM[(k * 131 | 0) % 4];
}

/* =========================================================
   体素存储：Map(key -> 颜色 + 类型*2^24)
   类型：0 实体  1 夜间发光  2 夜间彩虹动画发光  3 水体
   ========================================================= */
const OX = 220, OY = 16, OZ = 220, SY = 420, SZ = 460, T24 = 16777216;
const K = (x, y, z) => ((x + OX) * SY + (y + OY)) * SZ + (z + OZ);
class VSet {
  constructor() { this.m = new Map(); this.n = new Map(); }
  set(x, y, z, c, t = 0, nc = 0) {
    const k = K(Math.round(x), Math.round(y), Math.round(z));
    this.m.set(k, c + t * T24);
    if (t === 1 || t === 2) this.n.set(k, nc); else this.n.delete(k);
  }
  has(x, y, z) { return this.m.has(K(Math.round(x), Math.round(y), Math.round(z))); }
}
let V = new VSet();
const W = V;
const S = (x, y, z, c) => V.set(x, y, z, c, 0);
const G = (x, y, z, c, nc) => V.set(x, y, z, c, 1, nc);
const A = (x, y, z, c, nc) => V.set(x, y, z, c, 2, nc);
const Wt = (x, y, z, c) => V.set(x, y, z, c, 3);
function box(x0, y0, z0, x1, y1, z1, c) { for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) S(x, y, z, c); }
function boxF(x0, y0, z0, x1, y1, z1, f) { for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) f(x, y, z); }
function perim(x0, z0, x1, z1, f) { for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) if (x === x0 || x === x1 || z === z0 || z === z1) f(x, z); }
function line3(x0, y0, z0, x1, y1, z1, f) {
  const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)) * 1.3) + 1;
  for (let i = 0; i <= n; i++) { const t = i / n; f(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t), Math.round(z0 + (z1 - z0) * t)); }
}
function thickLine(x0, y0, z0, x1, y1, z1, r, f) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0, z1 - z0) * 1.5) + 1, R = Math.ceil(r);
  for (let i = 0; i <= n; i++) {
    const t = i / n, px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t, pz = z0 + (z1 - z0) * t;
    for (let dx = -R; dx <= R; dx++) for (let dy = -R; dy <= R; dy++) for (let dz = -R; dz <= R; dz++)
      if (dx * dx + dy * dy + dz * dz <= r * r) f(Math.round(px + dx), Math.round(py + dy), Math.round(pz + dz));
  }
}
function sphereShell(cx, cy, cz, r, f, th = 1.3) {
  const R = Math.ceil(r);
  for (let dx = -R; dx <= R; dx++) for (let dy = -R; dy <= R; dy++) for (let dz = -R; dz <= R; dz++) {
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (d <= r && d > r - th) f(cx + dx, cy + dy, cz + dz, dx, dy, dz);
  }
}
// 通用形体：只保留外壳体素，并告诉画笔朝向信息
function shape(x0, x1, y0, y1, z0, z1, inside, paint) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) {
    if (!inside(x, y, z)) continue;
    const ox = !inside(x - 1, y, z) || !inside(x + 1, y, z);
    const oz = !inside(x, y, z - 1) || !inside(x, y, z + 1);
    const top = !inside(x, y + 1, z);
    const bot = y > y0 && !inside(x, y - 1, z);
    if (!ox && !oz && !top && !bot) continue;
    paint(x, y, z, ox, oz, top, (ox && !oz) ? z : x);
  }
}

/* =========================================================
   地理：黄浦江 / 苏州河 / 地块
   ========================================================= */
const XMIN = -130, XMAX = 130, ZMIN = -100, ZMAX = 100, HW = 13;
const zc = x => 4 - 0.0012 * x * x;          // 黄浦江中心线
const bPx = x => Math.ceil(zc(x) + HW);       // 浦西第一排陆地 z
const pdE = x => Math.ceil(zc(x) - HW) - 1;   // 浦东第一排陆地 z
const creekA = { x: -80, z: 7 }, creekB = { x: -140, z: 70 };
const creekX = z => -80 - (z - 7) * (60 / 63);
function distSeg(px, pz, a, b) {
  const vx = b.x - a.x, vz = b.z - a.z, t = Math.max(0, Math.min(1, ((px - a.x) * vx + (pz - a.z) * vz) / (vx * vx + vz * vz)));
  return Math.hypot(px - a.x - vx * t, pz - a.z - vz * t);
}
const isRiver = (x, z) => Math.abs(z - zc(x)) < HW;
const isCreek = (x, z) => z > zc(x) + HW - 4 && distSeg(x, z, creekA, creekB) < 4.2;
const isPond = (x, z) => ((x - 40) / 13) ** 2 + ((z - 76) / 8) ** 2 < 1;
const isWater = (x, z) => isRiver(x, z) || isCreek(x, z) || isPond(x, z);
const nearWater = (x, z) => isWater(x + 1, z) || isWater(x - 1, z) || isWater(x, z + 1) || isWater(x, z - 1);
const inR = (v, a, b) => v >= a && v <= b;

const OW = XMAX - XMIN + 1, OD = ZMAX - ZMIN + 1;
const occ = new Uint8Array(OW * OD), GT = new Uint8Array(OW * OD);
const oi = (x, z) => (x - XMIN) * OD + (z - ZMIN);
const inMap = (x, z) => x >= XMIN && x <= XMAX && z >= ZMIN && z <= ZMAX;
function occupy(x0, z0, x1, z1) { for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) if (inMap(x, z)) occ[oi(x, z)] = 1; }
function isFree(x0, z0, x1, z1) { for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) { if (!inMap(x, z) || occ[oi(x, z)]) return false; } return true; }
const gtype = (x, z) => inMap(x, z) ? GT[oi(x, z)] : 255;

function grassC(x, z) {
  const h = hash3(x, 7, z);
  if (h > 0.968) return [0xff5c8a, 0xffd23f, 0xffffff, 0xb388ff, 0xff8c42, 0xff3b3b][(h * 1000 | 0) % 6];
  return cmix(0x58a53a, 0x8ad35c, vnoise(x, z, 6) * 0.8 + h * 0.2);
}
const asphalt = (x, z) => cmix(0x383b42, 0x44474e, hash3(x, 1, z));
function lotC(x, z, warm) {
  if (vnoise(x + 300, z, 9) > 0.64) return grassC(x, z);
  const base = warm ? 0xcdc5b6 : 0xd6d3cb;
  return ((x & 3) === 0 || (z & 3) === 0) ? cmul(base, 0.93) : cmix(base, 0xffffff, hash3(x, 2, z) * 0.12);
}
function roadNS(x, z, x0) { const i = x - x0; return (i === 2 && (z & 7) < 4) ? 0xe8e8e8 : asphalt(x, z); }
function roadEW(x, z, z0) { const i = z - z0; return (i === 2 && (x & 7) < 4) ? 0xe8e8e8 : asphalt(x, z); }

// 地面类型 0 空地 1 水 2 道路 3 步道 4 绿地 5 人行道 6 南京路 7 园林/寺院 8 江堤
function genGround() {
  for (let x = XMIN; x <= XMAX; x++) for (let z = ZMIN; z <= ZMAX; z++) {
    let t = 0, c = 0;
    const zr = zc(x);
    if (isWater(x, z)) t = 1;
    else if (z < zr) {                       // ---------- 浦东 ----------
      const dz = (zr - HW) - z;
      if (dz < 1) { t = 8; c = 0x9b958c; }
      else if (dz < 4) { t = 3; c = (((x >> 1) + (z >> 1)) & 1) ? 0xdcd5c8 : 0xc8c0b1; }
      else if (dz < 10) { t = 4; c = grassC(x, z); }
      else if (dz < 14) { t = 2; const i = Math.floor(dz) - 10; c = (i === 2 && (x & 7) < 4) ? 0xe8e8e8 : asphalt(x, z); if (inR(x, -4, -1) || inR(x, 108, 111)) c = (z & 1) ? 0xf0f0f0 : asphalt(x, z); }
      else if (inR(x, 90, 104)) { t = z <= -50 ? 2 : 4; c = t === 2 ? (x === 97 ? 0xf4c430 : asphalt(x, z)) : grassC(x, z); }
      else if (inR(x, -66, -63)) { t = 2; c = roadNS(x, z, -66); }
      else if (inR(x, -4, -1)) { t = 2; c = roadNS(x, z, -4); }
      else if (inR(x, 108, 111)) { t = 2; c = roadNS(x, z, 108); }
      else if (inR(z, -89, -86)) { t = 2; c = roadEW(x, z, -89); }
      else if (x < -4 && inR(z, -64, -61)) { t = 2; c = roadEW(x, z, -64); }
      else { t = 0; c = lotC(x, z, false); }
    } else {                                  // ---------- 浦西 ----------
      const dz = z - (zr + HW);
      if (dz < 1) { t = 8; c = 0xb3ab9d; }
      else if (dz < 6) { t = 3; c = (((x >> 1) + (z >> 1)) & 1) ? 0xded7ca : 0xc9c1b2; if (((x + z) % 9) === 0) c = 0xb8ae9c; }
      else if (dz < 8) { t = 4; c = grassC(x, z); }
      else if (dz < 16) {
        t = 2; const i = Math.floor(dz) - 8;
        c = (i === 3 || i === 4) ? 0xf4c430 : (i === 0 || i === 7) ? 0x6c6f75 : asphalt(x, z);
        if (inR(x, -40, -33) && i !== 3 && i !== 4) c = (x & 1) ? 0xf0f0f0 : asphalt(x, z);
      }
      else if (dz < 18) { t = 5; c = cmix(0xb9b2a5, 0xc6bfb2, hash3(x, 4, z)); }
      else if (inR(x, 90, 104)) { t = z >= 36 ? 2 : 4; c = t === 2 ? (x === 97 ? 0xf4c430 : asphalt(x, z)) : grassC(x, z); }
      else if (inR(x, -40, -33)) { t = 6; c = (((x + 40) >> 1) + (z >> 1)) & 1 ? 0xb8674c : 0xd4a27f; if ((z % 7) === 0) c = 0x8f4a36; }
      else if (inR(z, 52, 55) && x > creekX(z) + 6) { t = 2; c = roadEW(x, z, 52); }

  { top: 0x02040f, bot: 0x151a3c, sunC: 0x7f9cff, sunI: 0.45, hs: 0x3a4a8a, hg: 0x100c18, hi: 0.45, el: 0.75, az: -0.7, fog: 0x0e1230, exp: 1.1, bl: 0.5 },

const _c1 = new THREE.Color(), _c2 = new THREE.Color();
const lerpC = (a, b, t, out) => out.copy(_c1.setHex(a)).lerp(_c2.setHex(b), t);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
let tod = 0.08, todTarget = 0.08;
const sunDir = new THREE.Vector3();
function applyTime(t) {
  const [a, b, k] = t < 0.5 ? [KF[0], KF[1], t / 0.5] : [KF[1], KF[2], (t - 0.5) / 0.5];
  lerpC(a.top, b.top, k, skyMat.uniforms.top.value); lerpC(a.bot, b.bot, k, skyMat.uniforms.bot.value);
  lerpC(a.sunC, b.sunC, k, sun.color); sun.intensity = lerp(a.sunI, b.sunI, k);
  lerpC(a.hs, b.hs, k, hemi.color); lerpC(a.hg, b.hg, k, hemi.groundColor); hemi.intensity = lerp(a.hi, b.hi, k);
  lerpC(a.fog, b.fog, k, scene.fog.color);
  renderer.toneMappingExposure = lerp(a.exp, b.exp, k);
  bloom.strength = lerp(a.bl, b.bl, k);
  const el = lerp(a.el, b.el, k), az = t < 0.5 ? lerp(a.az, b.az, k) : lerp(a.az, b.az, k);
  sunDir.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).normalize();
  sun.position.copy(sun.target.position).addScaledVector(sunDir, 600);
  const night = smooth(0.5, 0.9, t);
  U.uNight.value = night; skyMat.uniforms.night.value = smooth(0.55, 0.85, t);
  const sd = t < 0.75 ? sunDir : new THREE.Vector3(-0.5, 0.15, 0.3).normalize();
  skyMat.uniforms.sunDir.value.copy(sd); skyMat.uniforms.sunCol.value.copy(sun.color);
  starMat.opacity = smooth(0.62, 0.95, t);
  moon.material.opacity = smooth(0.65, 0.95, t); moon.visible = moon.material.opacity > 0.01;
  moon.position.copy(sunDir).multiplyScalar(2500);
  beams.forEach(b => b.mat.uniforms.op.value = smooth(0.7, 1.0, t) * 0.16);
  renderer.shadowMap.needsUpdate = true;
  const labels = [[0.18, '☀️ 正午 · 晴空万里'], [0.38, '🌤 午后 · 江风徐来'], [0.6, '🌇 黄昏 · 落日熔金'], [0.8, '🏮 华灯初上'], [1.01, '🌃 魔都之夜 · 不夜城']];
  $('todLabel').textContent = labels.find(l => t < l[0])[1];
}

let autoCycle = false, cyclePh = 0;
const todEl = $('tod');
todEl.oninput = () => { autoCycle = false; $('bCycle').classList.remove('on'); todTarget = tod = todEl.value / 1000; applyTime(tod); };
$('bNight').onclick = () => { autoCycle = false; $('bCycle').classList.remove('on'); todTarget = todTarget > 0.6 ? 0.08 : 1; $('bNight').textContent = todTarget > 0.6 ? '☀️ 一键白天' : '🌃 一键夜景'; };

/* =========================================================
   主循环
   ========================================================= */
const clock = new THREE.Clock();
let time = 0, fwTimer = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  U.uTime.value = time;
  if (autoCycle) { cyclePh += dt * 0.09; todTarget = 0.5 - 0.5 * Math.cos(cyclePh); tod = todTarget; applyTime(tod); todEl.value = tod * 1000; }
  else if (Math.abs(todTarget - tod) > 0.0005) { tod += Math.sign(todTarget - tod) * Math.min(Math.abs(todTarget - tod), dt * 0.45); applyTime(tod); todEl.value = tod * 1000; }

  for (const b of boats) {
    b.x += b.dir * b.speed * dt;
    if (b.x > 140) b.x = -140; if (b.x < -140) b.x = 140;
    const z = zc(b.x) + b.lane, dz = -0.0024 * b.x * b.dir;
    b.g.position.set(b.x, -1 + Math.sin(time * 1.3 + b.ph) * 0.15, z);
    b.g.rotation.set(Math.sin(time * 0.9 + b.ph) * 0.02, Math.atan2(-dz, b.dir), 0);
    b.g.visible = Math.abs(b.x) < 118;
  }
  for (const c of cars) {
    c.s += c.dir * c.speed * dt;
    const lo = c.path.startsWith('br') ? -100 : -132, hi = c.path.startsWith('br') ? 100 : 132;
    if (c.s > hi) c.s = lo; if (c.s < lo) c.s = hi;
    carPose(c);
  }
  for (const cl of clouds) { cl.g.position.x += cl.speed * dt; if (cl.g.position.x > 220) cl.g.position.x = -220; }
  if (tram) { tram.z += tram.dir * 4 * dt; if (tram.z > 92) tram.dir = -1; if (tram.z < 62) tram.dir = 1; tram.g.position.z = tram.z; tram.g.rotation.y = tram.dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
  const blink = (Math.sin(time * 3.2) > 0.2) ? 1 : 0.08;
  aviMat.color.setRGB(6 * blink, 0.25 * blink, 0.2 * blink);
  for (const b of beams) { b.piv.rotation.z = Math.sin(time * 0.35 + b.ph) * 0.45; b.piv.rotation.x = Math.cos(time * 0.27 + b.ph * 1.3) * 0.35; b.piv.visible = b.mat.uniforms.op.value > 0.002; }
  if (U.uNight.value > 0.75) { fwTimer -= dt; if (fwTimer <= 0) { launch(); fwTimer = 0.5 + Math.random() * 1.3; } }
  updateFireworks(dt);

  if (tween) {
    tween.t += dt; const k = Math.min(1, tween.t / tween.dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    camera.position.y += Math.sin(Math.PI * e) * tween.p0.distanceTo(tween.p1) * 0.12;
    if (k >= 1) tween = null;
  }
  skyGroup.position.copy(camera.position);
  controls.update();
  composer.render();
}
