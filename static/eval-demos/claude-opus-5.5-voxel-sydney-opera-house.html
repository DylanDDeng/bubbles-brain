<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>体素悉尼歌剧院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&display=swap">
<style>
  :root {
    --ink: #f4efe4;
    --ink-dim: rgba(244, 239, 228, 0.66);
    --panel: rgba(8, 24, 40, 0.56);
    --line: rgba(244, 239, 228, 0.14);
    --sand: #e3ad68;
    --sand-ink: #22160a;
    --deep: #0a1b2b;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--deep); }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--ink);
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .card {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 16px;
    max-width: min(320px, calc(100% - 32px));
    padding: 16px 18px 14px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-sizing: border-box;
  }
  .eyebrow {
    margin: 0;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--sand);
    font-variant-numeric: tabular-nums;
  }
  h1 {
    margin: 6px 0 4px;
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-weight: 900;
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: 0.06em;
    text-wrap: balance;
  }
  .sub { margin: 0; color: var(--ink-dim); font-size: 13px; }
  .facts {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 14px;
    margin: 12px 0 0;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 12px;
  }
  .facts dt { color: var(--ink-dim); }
  .facts dd { margin: 0; font-variant-numeric: tabular-nums; }

  .dock {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    width: max-content;
    max-width: calc(100% - 32px);
  }
  .seg {
    display: flex;
    gap: 2px;
    padding: 4px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .dock button {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 0;
    padding: 7px 15px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color .2s, color .2s;
  }
  .dock button:hover { background: rgba(244, 239, 228, 0.1); }
  .dock button[aria-pressed="true"] { background: var(--sand); color: var(--sand-ink); font-weight: 600; }
  .dock button:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }

  .hint {
    position: fixed;
    right: 16px;
    top: calc(16px + env(safe-area-inset-top, 0px));
    margin: 0;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--ink-dim);
    background: var(--panel);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  #loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--deep);
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.12em;
    transition: opacity .7s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }

  @media (max-width: 640px) {
    .card { padding: 12px 14px; }
    h1 { font-size: 22px; }
    .facts, .hint { display: none; }
    .dock button { padding: 7px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #loading, .dock button { transition: none; }
  }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="可旋转的悉尼歌剧院体素模型"></canvas>

<div class="card">
  <p class="eyebrow">Bennelong Point · 33.857°S 151.215°E</p>
  <h1>悉尼歌剧院</h1>
  <p class="sub">体素微缩模型 · 贝壳屋顶、滨水台地与港湾</p>
  <dl class="facts">
    <dt>设计</dt><dd>Jørn Utzon</dd>
    <dt>启用</dt><dd>1973 年</dd>
    <dt>比例</dt><dd>1 体素 ≈ 2 米</dd>
  </dl>
</div>

<p class="hint">拖动旋转 · 滚轮缩放 · 右键平移</p>

<div class="dock">
  <div class="seg" role="group" aria-label="时段">
    <button type="button" id="t-day" data-preset="day" aria-pressed="true">白昼</button>
    <button type="button" id="t-dusk" data-preset="dusk" aria-pressed="false">黄昏</button>
    <button type="button" id="t-night" data-preset="night" aria-pressed="false">夜晚</button>
  </div>
  <div class="seg">
    <button type="button" id="t-orbit" aria-pressed="true">环绕</button>
  </div>
</div>

<div id="loading">正在堆砌体素…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const loadingEl = document.getElementById('loading');
  if (!window.THREE || !THREE.OrbitControls) {
    loadingEl.textContent = '三维库加载失败，请检查网络后刷新';
    return;
  }
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 随机数（固定种子，每次生成同一座城） ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(1973);
  const pick = arr => arr[Math.floor(rand() * arr.length)];
  function jit(hex, a) {
    const f = 1 + (rand() * 2 - 1) * a;
    const r = Math.min(255, Math.max(0, (((hex >> 16) & 255) * f) | 0));
    const g = Math.min(255, Math.max(0, (((hex >> 8) & 255) * f) | 0));
    const b = Math.min(255, Math.max(0, ((hex & 255) * f) | 0));
    return (r << 16) | (g << 8) | b;
  }

  /* ---------- 体素仓库 ---------- */
  const VOX = new Map();
  const K = (x, y, z) => ((x + 512) * 1024 + (y + 128)) * 1024 + (z + 512);
  function put(x, y, z, c, m) {
    m = m || 'solid';
    const k = K(x, y, z);
    const e = VOX.get(k);
    if (e) {
      if (m === 'glass') return;                     // 玻璃不覆盖任何东西
      if (e[4] === 'shell' && m !== 'shell') return;  // 壳体只让位给壳体
    }
    VOX.set(k, [x, y, z, c, m]);
  }
  const has = (x, y, z) => VOX.has(K(x, y, z));
  const getV = (x, y, z) => VOX.get(K(x, y, z));
  function topAt(x, z, from) {
    for (let y = from || 60; y >= 0; y--) if (has(x, y, z)) return y;
    return -1;
  }

  /* ---------- 地形：便利朗角、南岸、东岸植物园、北岸 ---------- */
  const X0 = -125, X1 = 90, Z0 = -100, Z1 = 88;
  function penHalf(z) {
    if (z < -64 || z > 38) return -1;
    if (z <= 24) return 40;
    const t = (z - 24) / 14;
    return 40 * Math.sqrt(Math.max(0, 1 - t * t));
  }
  const inPen = (x, z) => Math.abs(x) <= penHalf(z);
  const inCove = (x, z) => x >= -72 && x <= -44 && z > -86 && z <= -64;       // 悉尼湾 / 环形码头
  const inSouth = (x, z) => z <= -64 && !inCove(x, z);
  function inEast(x, z) {                                                     // 麦考利夫人角
    if (z > 12) return false;
    return x >= (z > -10 ? 62 + (z + 10) * 0.8 : 62);
  }
  const inNorth = (x, z) => x <= -60 && z >= 64 + Math.max(0, x + 70) * 0.5; // 北岸
  const isLand = (x, z) => inPen(x, z) || inSouth(x, z) || inEast(x, z) || inNorth(x, z);
  const bridgeCorridor = x => x >= -106 && x <= -78;

  const grassCells = [];
  for (let x = X0; x <= X1; x++) {
    for (let z = Z0; z <= Z1; z++) {
      if (!isLand(x, z)) continue;
      let top;
      if (inPen(x, z) && z > -68) {
        top = jit((x % 4 === 0 || z % 4 === 0) ? 0xcbb591 : 0xd8c4a0, 0.035);
      } else if (inEast(x, z) || inNorth(x, z) || (inSouth(x, z) && x > 22)) {
        const path = inSouth(x, z) && (Math.abs(-82 + Math.sin(x * 0.09) * 7 - z) < 1.3 || Math.abs(x - 36 - Math.sin(z * 0.1) * 5) < 1.2);
        if (path) top = jit(0xdac9a6, 0.03);
        else { top = jit(pick([0x6aa04a, 0x5f9443, 0x74a852]), 0.05); grassCells.push([x, z]); }
      } else if (x > -44) {
        top = jit(0xcfc3ac, 0.04);
      } else {
        top = jit(0xaaa399, 0.05);
      }
      put(x, 2, z, top);
      put(x, 1, z, jit(0xb39a73, 0.06));
      put(x, 0, z, jit(0x9d855f, 0.06));
    }
  }

  /* ---------- 花岗岩台基 ---------- */
  function podHalf(z) {
    if (z < -38 || z > 28) return -1;
    if (z <= 18) return 33;
    const t = (z - 18) / 10;
    return 33 * Math.sqrt(Math.max(0, 1 - t * t));
  }
  for (let z = -38; z <= 28; z++) {
    const h = podHalf(z);
    for (let x = -33; x <= 33; x++) {
      if (Math.abs(x) > h) continue;
      for (let y = 3; y <= 9; y++) {
        let c;
        if (y === 9) c = jit((x % 6 === 0 || z % 6 === 0) ? 0xc9ad85 : 0xdcc39c, 0.03);
        else if (y === 8) c = jit(0x8c5343, 0.04);
        else {
          const sideWall = Math.abs(x) >= h - 1.5;
          const rib = sideWall ? (z % 4 === 0) : (x % 4 === 0);
          c = jit(rib ? 0x985b47 : 0xb2705a, 0.05);
        }
        put(x, y, z, c);
      }
    }
  }

  /* ---------- 纪念台阶（南侧主入口） ---------- */
  for (let z = -52; z <= -39; z++) {
    const k = Math.floor((z + 52) / 2);
    const level = 3 + k;
    for (let x = -26; x <= 26; x++) {
      for (let y = 3; y <= level; y++) {
        put(x, y, z, y === level ? jit(k % 2 ? 0xd8c099 : 0xe9d6b1, 0.025) : jit(0xc7ad86, 0.03));
      }
    }
    for (const x of [-27, 27]) {
      for (let y = 3; y <= Math.min(10, level + 1); y++) put(x, y, z, jit(0x9e604b, 0.05));
    }
  }

  /* ---------- 便利朗餐厅的小台基 ---------- */
  for (let x = -38; x <= -29; x++) for (let z = -57; z <= -41; z++) for (let y = 3; y <= 6; y++) {
    put(x, y, z, y === 6 ? jit(0xdcc39c, 0.03) : jit(y === 5 ? 0x8c5343 : 0xb2705a, 0.05));
  }

  /* ---------- 贝壳屋顶：尖拱截面沿纵轴缩放的壳体 ---------- */
  function shellTile(z, ly, u) {
    if (u < 1.2) return jit(0xfbfaf4, 0.015);
    return jit(((Math.floor(z / 2) + Math.floor(ly / 2)) & 1) ? 0xf2efe6 : 0xe2dccb, 0.02);
  }
  function buildShell(o) {
    const { cx, zf, dir, L, H, W, lean } = o;
    const base = o.base == null ? 10 : o.base;
    const th = 0.75;
    const xmin = Math.floor(cx - W - 2), xmax = Math.ceil(cx + W + 2);
    const za = zf - dir * L, zb = zf + dir * (lean + 1);
    const zmin = Math.floor(Math.min(za, zb)) - 1, zmax = Math.ceil(Math.max(za, zb)) + 1;
    for (let z = zmin; z <= zmax; z++) {
      for (let x = xmin; x <= xmax; x++) {
        const ax = Math.abs(x - cx);
        for (let ly = 0; ly <= H + 1; ly++) {
          let hit = false, inside = false, cap = false, uHit = 99;
          for (let s = -0.375; s <= 0.38; s += 0.25) {
            const u = (zf - (z + s)) * dir;
            if (u > L) continue;
            let t;
            if (u < 0) {
              if (u < -lean || ly < H * (-u / lean)) continue;   // 壳尖前倾
              t = 1;
            } else t = 1 - u / L;
            const Ws = W * (0.6 + 0.4 * t);
            const Hs = Math.max(H * (0.28 + 0.72 * Math.sin(t * Math.PI / 2)), Ws * 1.15);
            const c = (Hs * Hs - Ws * Ws) / (2 * Ws);
            const r = Ws + c;
            const d = Math.hypot(ax + c, ly);
            if (ly <= Hs + 0.5 && Math.abs(d - r) <= th) { hit = true; uHit = Math.min(uHit, u); }
            else if (d < r - th && u >= 0) {
              if (u >= 0.6 && u < 1.6) inside = true;
              if (u > L - 1) cap = true;
            }
          }
          const y = base + ly;
          if (hit) put(x, y, z, shellTile(z, ly, uHit), 'shell');
          else if (inside) {
            const mullion = Math.round(x - cx) % 3 === 0 || ly % 4 === 0;
            if (mullion) { if (!has(x, y, z)) put(x, y, z, jit(0x5d4d3b, 0.05), 'solid'); }
            else put(x, y, z, jit(0x22384b, 0.08), 'glass');
          } else if (cap) put(x, y, z, shellTile(z, ly, 9), 'shell');
        }
      }
    }
  }
  [
    // 音乐厅（西）
    { cx: -14, zf: -30, dir: -1, L: 14, H: 17, W: 9, lean: 3 },
    { cx: -14, zf: -6, dir: 1, L: 16, H: 24, W: 10, lean: 3 },
    { cx: -14, zf: 8, dir: 1, L: 18, H: 31, W: 11, lean: 4 },
    { cx: -14, zf: 20, dir: 1, L: 14, H: 25, W: 10.5, lean: 4 },
    // 琼·萨瑟兰剧院（东）
    { cx: 13, zf: -32, dir: -1, L: 14, H: 15, W: 8, lean: 3 },
    { cx: 13, zf: -9, dir: 1, L: 16, H: 21, W: 9, lean: 3 },
    { cx: 13, zf: 5, dir: 1, L: 17, H: 28, W: 10, lean: 4 },
    { cx: 13, zf: 16, dir: 1, L: 13, H: 22, W: 9.5, lean: 4 },
    // 便利朗餐厅
    { cx: -33.5, zf: -55, dir: -1, L: 7, H: 10, W: 4.2, lean: 2, base: 7 },
    { cx: -33.5, zf: -44, dir: 1, L: 8, H: 12, W: 4.6, lean: 2, base: 7 }
  ].forEach(buildShell);

  /* ---------- 海港大桥 ---------- */
  const topY = z => 17 + 31 * (1 - (z / 56) * (z / 56));
  const botY = z => 2 + 38 * (1 - (z / 54) * (z / 54));
  const STEEL = 0x76858c, STEEL2 = 0x66747b, GRANITE = 0xc8b08a;
  function column(x, z, y0, y1, c, m) {
    const a = Math.round(Math.min(y0, y1)), b = Math.round(Math.max(y0, y1));
    for (let y = a; y <= b; y++) put(x, y, z, jit(c, 0.04), m);
  }
  // 桥面
  for (let z = -100; z <= 88; z++) {
    for (let x = -98; x <= -86; x++) {
      put(x, 13, z, jit(STEEL2, 0.04));
      const road = x >= -95 && x <= -89;
      let c = road ? 0x3a3e44 : 0x8f9294;
      if (x === -92 && (z & 3) < 2) c = 0xd9d2ae;
      put(x, 14, z, jit(c, 0.04));
    }
    put(-98, 15, z, jit(STEEL, 0.03));
    put(-86, 15, z, jit(STEEL, 0.03));
    if (z % 6 === 0) { put(-98, 16, z, 0xe8e0c8, 'lamp'); put(-86, 16, z, 0xe8e0c8, 'lamp'); }
  }
  // 拱桁架
  for (const tx of [-97, -88]) {
    for (let z = -56; z <= 56; z++) {
      const zn = z < 56 ? z + 1 : z;
      for (const x of [tx, tx + 1]) {
        column(x, z, topY(z), topY(zn), STEEL);
        put(x, Math.round(topY(z)) - 1, z, jit(STEEL, 0.04));
        if (Math.abs(z) <= 54) column(x, z, botY(z), botY(Math.abs(zn) <= 54 ? zn : z), STEEL);
      }
      if (z % 5 === 0 && tx === -97) put(tx, Math.round(topY(z)) + 1, z, 0xe8e0c8, 'lamp');
    }
    for (let z = -52; z <= 52; z += 4) {
      column(tx, z, botY(z), topY(z), STEEL2);
      if (botY(z) > 15) column(tx + (tx < -92 ? 0 : 1), z, 15, botY(z), STEEL2);
      if (z < 52) {                                           // 斜腹杆
        const za = z, zb = z + 4, up = ((z / 4) & 1) === 0;
        for (let s = 0; s <= 1; s += 1 / 14) {
          const zz = za + (zb - za) * s;
          const y = up ? botY(zz) + (topY(zz) - botY(zz)) * s : topY(zz) - (topY(zz) - botY(zz)) * s;
          put(tx, Math.round(y), Math.round(zz), jit(STEEL2, 0.04));
        }
      }
    }
  }
  for (let z = -48; z <= 48; z += 8) for (let x = -96; x <= -89; x++) put(x, Math.round(topY(z)), z, jit(STEEL2, 0.04));
  // 桥塔
  for (const zc of [-60, 60]) {
    for (const [xa, xb] of [[-105, -99], [-85, -79]]) {
      for (let x = xa; x <= xb; x++) for (let z = zc - 4; z <= zc + 4; z++) for (let y = 0; y <= 30; y++) {
        const inset = y >= 27 ? 1 : 0;
        if (x < xa + inset || x > xb - inset || z < zc - 4 + inset || z > zc + 4 - inset) continue;
        put(x, y, z, jit(y % 3 === 0 ? 0xb49c78 : GRANITE, 0.04));
      }
    }
    for (let x = -99; x <= -85; x++) for (let z = zc - 6 * Math.sign(zc); Math.abs(z) <= Math.abs(zc) - 2; z += Math.sign(zc)) {
      for (let y = 0; y <= 3; y++) put(x, y, z, jit(GRANITE, 0.04));
    }
  }
  // 引桥桥墩
  for (const z of [-96, -88, -80, -72, 70, 78, 86]) {
    for (const x of [-97, -87]) column(x, z, 3, 12, 0xa89779);
  }

  /* ---------- 环形码头的栈桥 ---------- */
  for (const px of [-67, -59, -51]) {
    for (let x = px; x <= px + 2; x++) for (let z = -85; z <= -74; z++) {
      put(x, 1, z, jit(0x7e6d58, 0.05));
      put(x, 2, z, jit(0xb9aa93, 0.04));
    }
    for (let x = px; x <= px + 2; x++) for (let z = -80; z <= -76; z++) put(x, 5, z, jit(0x2f6b4a, 0.04));
    for (const [x, z] of [[px, -80], [px + 2, -80], [px, -76], [px + 2, -76]]) column(x, z, 3, 4, 0xd8d2c2);
  }

  /* ---------- 城市与低层建筑 ---------- */
  const winDay = [], winNight = [];
  const occupied = [];
  const free = (x0, z0, w, d) => occupied.every(r => x0 + w + 1 < r[0] || r[0] + r[2] + 1 < x0 || z0 + d + 1 < r[1] || r[1] + r[3] + 1 < z0);
  function building(x0, z0, w, d, h, col) {
    occupied.push([x0, z0, w, d]);
    const yTop = 3 + h - 1;
    for (let x = x0; x < x0 + w; x++) for (let z = z0; z < z0 + d; z++) for (let y = 3; y <= yTop; y++) {
      const wall = x === x0 || x === x0 + w - 1 || z === z0 || z === z0 + d - 1;
      const corner = (x === x0 || x === x0 + w - 1) && (z === z0 || z === z0 + d - 1);
      if (wall && !corner && y > 3 && y < yTop && y % 2 === 0 && ((x + z) & 1) === 0) put(x, y, z, 0, 'win');
      else put(x, y, z, jit(col, 0.04));
    }
    if (h > 10 && rand() < 0.6) {
      const cx = x0 + 1 + Math.floor(rand() * (w - 3)), cz = z0 + 1 + Math.floor(rand() * (d - 3));
      for (let x = cx; x <= cx + 1; x++) for (let z = cz; z <= cz + 1; z++) put(x, yTop + 1, z, jit(0x8b9196, 0.05));
    }
  }
  let bCount = 0;
  for (let i = 0; i < 900 && bCount < 38; i++) {
    const w = 6 + Math.floor(rand() * 6), d = 6 + Math.floor(rand() * 6);
    const x0 = Math.floor(X0 + 1 + rand() * (22 - X0 - w));

  /* ---------- 时段预设 ---------- */
  const PRESETS = {

  /* ---------- 动画循环 ---------- */
  const clock = new THREE.Clock();

    });
    carMesh.instanceMatrix.needsUpdate = true;

    clouds.forEach(c => {
      c.mesh.position.x += c.v * dt * m;
      if (c.mesh.position.x > 190) c.mesh.position.x = -200;
    });

    sky.position.copy(camera.position);
    stars.position.copy(camera.position);
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(() => {
    frame();
    loadingEl.classList.add('done');
    setTimeout(() => loadingEl.remove(), 800);
  });
})();
</script>
</body>
</html>
