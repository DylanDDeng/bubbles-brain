<!DOCTYPE html>

<head>

<style>
:root{--gold:#ffd27a;--pink:#ff5fa8;--cyan:#5fe6ff;--glass:rgba(14,18,38,.55);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1024;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#c.drag{cursor:grabbing}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(4,6,20,.55) 100%)}
#title{position:fixed;left:28px;top:22px;pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.45)}
#title h1{font-size:44px;font-weight:800;letter-spacing:.18em;line-height:1;background:linear-gradient(90deg,#ffe29a,#ff8fb8 55%,#7fe9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#title p{margin-top:8px;font-size:12px;letter-spacing:.42em;opacity:.85;text-transform:uppercase}
#title small{display:block;margin-top:4px;font-size:11px;opacity:.55;letter-spacing:.12em}
#clock{position:fixed;right:26px;top:22px;text-align:right;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.5)}
#clock b{font-size:38px;font-weight:300;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#clock span{display:block;font-size:12px;letter-spacing:.3em;opacity:.8;margin-top:2px}
.panel{position:fixed;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
#nav{left:50%;bottom:20px;transform:translateX(-50%);padding:10px 14px;display:flex;flex-direction:column;gap:9px;align-items:center;max-width:calc(100vw - 24px)}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:inherit;color:#fff;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.18s;letter-spacing:.04em;white-space:nowrap}
button:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
button.on{background:linear-gradient(90deg,rgba(255,180,90,.5),rgba(255,90,160,.5));border-color:rgba(255,255,255,.4)}
#time{display:flex;align-items:center;gap:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(300px,42vw);height:6px;border-radius:6px;outline:none;background:linear-gradient(90deg,#0d1240 0%,#ff8a5c 27%,#7dc4ff 50%,#ff7a5c 73%,#0d1240 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #ff9ac2;box-shadow:0 0 12px rgba(255,160,200,.9);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #ff9ac2;cursor:pointer}
#tog{right:20px;bottom:20px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
#tog button{border-radius:10px;text-align:left;padding:5px 12px;font-size:12px}
#hint{position:fixed;left:28px;bottom:24px;font-size:12px;opacity:.6;line-height:1.7;pointer-events:none;letter-spacing:.06em;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.lab{position:fixed;left:0;top:0;pointer-events:none;font-size:12px;letter-spacing:.12em;padding:3px 9px 3px 8px;border-radius:999px;background:rgba(10,14,34,.62);border:1px solid rgba(255,255,255,.28);white-space:nowrap;transform:translate(-50%,-140%);will-change:transform;text-shadow:0 1px 4px #000}
.lab::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:12px;background:rgba(255,255,255,.55)}
.lab i{font-style:normal;opacity:.6;margin-left:6px;font-size:10px;letter-spacing:.08em}
#load{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#25204d,#0b1024 70%);transition:opacity .9s;gap:18px}
#load h2{font-size:34px;font-weight:800;letter-spacing:.3em;background:linear-gradient(90deg,#ffe29a,#ff8fb8,#7fe9ff);-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:.3em}
#load .bar{width:min(320px,70vw);height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd27a,#ff5fa8,#5fe6ff);transition:width .25s}
#load p{font-size:13px;opacity:.7;letter-spacing:.2em}
#err{position:fixed;inset:auto 20px 20px 20px;z-index:20;background:#500;padding:12px;border-radius:8px;font:12px/1.5 monospace;display:none;white-space:pre-wrap;max-height:40vh;overflow:auto}
@media (max-width:760px){#title h1{font-size:30px}#clock b{font-size:26px}#hint{display:none}#tog{display:none}}
</style>

<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="title"><h1>上海</h1><p>Shanghai · Voxel City</p><small>魔都 · 外滩 · 陆家嘴 · 豫园</small></div>

<script>
if(!window.THREE){document.addEventListener('DOMContentLoaded',()=>{document.getElementById('ltxt').textContent='无法加载 three.js —— 请确认网络可访问 cdnjs.cloudflare.com 后刷新';});}

<script>
'use strict';
/* ===================================================================
   SHANGHAI VOXEL CITY  ·  单文件体素场景
   1 体素 ≈ 5 米。世界：X 向东，Z 向南，Y 向上
   =================================================================== */
const W = 260, H = 176, D = 200, GY = 14;   // 世界尺寸 & 地面高度

// ---------- 随机数 / 噪声 ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rnd = mulberry32(20260928);
const rr = (a,b)=>a+(b-a)*rnd();
const ri = (a,b)=>Math.floor(a+(b-a+1)*rnd());
const pick = a=>a[Math.floor(rnd()*a.length)];
function hash3(x,y,z){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(z|0,1274126177))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const hash2 = (x,z)=>hash3(x,7,z);
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

// ---------- 调色板 ----------
// kind: 0 实体 | 1 窗(55%亮) | 2 办公窗(88%亮) | 3 霓虹常亮 | 4 彩虹流光 | 5 呼吸脉冲 | 6 航空障碍灯闪烁
const PAL=[[0,0,0,0]]; const palMap=new Map();
function col(hex,kind=0){const key=hex*8+kind;let i=palMap.get(key);if(i===undefined){i=PAL.length;PAL.push([(hex>>16)&255,(hex>>8)&255,hex&255,kind]);palMap.set(key,i);}return i;}
function tint(hex,f){const r=clamp(((hex>>16)&255)*f,0,255),g=clamp(((hex>>8)&255)*f,0,255),b=clamp((hex&255)*f,0,255);return (r<<16)|(g<<8)|b;}
function mixc(a,b,t){const r=lerp((a>>16)&255,(b>>16)&255,t),g=lerp((a>>8)&255,(b>>8)&255,t),bl=lerp(a&255,b&255,t);return ((r|0)<<16)|((g|0)<<8)|(bl|0);}

// ---------- 体素网格 ----------
class Grid{
  constructor(w,h,d){this.w=w;this.h=h;this.d=d;this.a=new Uint16Array(w*h*d);}
  get(x,y,z){if(x<0||y<0||z<0||x>=this.w||y>=this.h||z>=this.d)return 0;return this.a[((y|0)*this.d+(z|0))*this.w+(x|0)];}
  set(x,y,z,c){if(x<0||y<0||z<0||x>=this.w||y>=this.h||z>=this.d)return;this.a[((y|0)*this.d+(z|0))*this.w+(x|0)]=c;}
}
let G = new Grid(W,H,D);
const setv=(x,y,z,c)=>G.set(x,y,z,c);
const getv=(x,y,z)=>G.get(x,y,z);
function box(x,y,z,w,h,d,c){
  x=Math.floor(x);y=Math.floor(y);z=Math.floor(z);w=Math.round(w);h=Math.round(h);d=Math.round(d);
  const x0=Math.max(0,x),x1=Math.min(G.w,x+w),y0=Math.max(0,y),y1=Math.min(G.h,y+h),z0=Math.max(0,z),z1=Math.min(G.d,z+d);
  for(let yy=y0;yy<y1;yy++)for(let zz=z0;zz<z1;zz++){const i=(yy*G.d+zz)*G.w;for(let xx=x0;xx<x1;xx++)G.a[i+xx]=c;}
}
// 圆柱（cx,cz 为中心，单元中心采样）
function cyl(cx,cz,r,y,h,c){
  const x0=Math.floor(cx-r),x1=Math.ceil(cx+r),z0=Math.floor(cz-r),z1=Math.ceil(cz+r);
  for(let zz=z0;zz<z1;zz++)for(let xx=x0;xx<x1;xx++){const dx=xx+.5-cx,dz=zz+.5-cz;if(dx*dx+dz*dz<=r*r){for(let yy=y;yy<y+h;yy++)setv(xx,yy,zz,typeof c==='function'?c(xx,yy,zz,dx,dz):c);}}
}
// 圆环
function ring(cx,cz,r0,r1,y,h,c){
  const x0=Math.floor(cx-r1),x1=Math.ceil(cx+r1),z0=Math.floor(cz-r1),z1=Math.ceil(cz+r1);
  for(let zz=z0;zz<z1;zz++)for(let xx=x0;xx<x1;xx++){const dx=xx+.5-cx,dz=zz+.5-cz,q=dx*dx+dz*dz;if(q<=r1*r1&&q>=r0*r0){for(let yy=y;yy<y+h;yy++)setv(xx,yy,zz,typeof c==='function'?c(xx,yy,zz,dx,dz):c);}}
}
// 椭球 / 球（c 可为函数(x,y,z,dx,dy,dz)）
function ellip(cx,cy,cz,rx,ry,rz,c,noise=0){
  const x0=Math.floor(cx-rx-1),x1=Math.ceil(cx+rx+1),y0=Math.floor(cy-ry-1),y1=Math.ceil(cy+ry+1),z0=Math.floor(cz-rz-1),z1=Math.ceil(cz+rz+1);
  for(let yy=y0;yy<y1;yy++)for(let zz=z0;zz<z1;zz++)for(let xx=x0;xx<x1;xx++){
    const dx=(xx+.5-cx)/rx,dy=(yy+.5-cy)/ry,dz=(zz+.5-cz)/rz;let q=dx*dx+dy*dy+dz*dz;
    if(noise)q+=(hash3(xx,yy,zz)-.5)*noise;
    if(q<=1)setv(xx,yy,zz,typeof c==='function'?c(xx,yy,zz,dx*rx,dy*ry,dz*rz):c);
  }
}
const sphere=(cx,cy,cz,r,c,n)=>ellip(cx,cy,cz,r,r,r,c,n);
// 三维线段（t = 粗细）
function line3(x0,y0,z0,x1,y1,z1,c,t=1){
  const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0),1);
  for(let i=0;i<=n;i++){const f=i/n;const x=Math.floor(x0+(x1-x0)*f+.0001),y=Math.floor(y0+(y1-y0)*f+.0001),z=Math.floor(z0+(z1-z0)*f+.0001);if(t<=1)setv(x,y,z,c);else box(x,y,z,t,t,t,c);}
}

// ---------- 常用颜色 ----------
const K={
  soil1:0x6b4a32,soil2:0x5a3d2a,soil3:0x7a5a3c,rock1:0x6d6e78,rock2:0x585a66,rock3:0x4a4c58,rock4:0x8a8a92,
  grass1:0x6fc35a,grass2:0x62b64f,grass3:0x7ccf62,grass4:0x58a848,
  asphalt:0x3c404c,asphalt2:0x454a58,line:0xf2e8b8,white:0xf4f4f0,curb:0xb4b8c0,
  pave1:0xd9d4c8,pave2:0xcbc5b8,pave3:0xe6dfd0,plaza:0xc9c1b4,brick:0xb5623f,
  stone:0xa5a8ae,stoneDk:0x7c8088,granite:0x8d8f96,
  water1:0x2a86d0,water2:0x1f6cb8,water3:0x175aa0,
  gold:0xffc94a,red:0xd8342c,redDk:0xa8241f,orange:0xf08a30,
  glassBlue:0x8ab8e0,steel:0xaeb9c6,steelDk:0x7d8896,
  roofGray:0x5a6070,roofBlack:0x3a3e4a,roofRed:0xb84a36,roofGreen:0x4fa088,copper:0x58b592,
  wood:0x8a5a34,woodDk:0x5e3b22,cream:0xf0e2bc,
  trunk:0x7a5638,
};
const WIN={
  warm:col(0xffd27a,1),warm2:col(0xffb85a,1),cool:col(0xcfe8ff,1),white:col(0xfff4d8,1),teal:col(0x7be8dc,1),blue:col(0x8fc4ff,1),pink:col(0xffa8d0,1),
  offW:col(0xffe6a8,2),offC:col(0xbfe0ff,2),offT:col(0x8af0e6,2),offG:col(0xffd870,2),offB:col(0x6fb0ff,2),offP:col(0xffb0e0,2),
};
const NEON={gold:col(0xffc850,3),warm:col(0xffaa50,3),red:col(0xff3040,3),pink:col(0xff4fa0,3),cyan:col(0x40e8ff,3),blue:col(0x4090ff,3),green:col(0x50ff90,3),white:col(0xfff4dc,3),purple:col(0xb060ff,3),yellow:col(0xffee55,3)};
const WINL={cool:col(0xb8e2ff,7),warm:col(0xffe0a0,7),teal:col(0x98f0ea,7),gold:col(0xffe090,7)};
const RAINBOW=col(0xffffff,4), PULSE=col(0xff60b0,5), BEACON=col(0xff2030,6);

// ---------- 河道几何 ----------
const riverC = z=>134+8*Math.sin(z/38+0.6);
const HW = 18;
const xlA = z=>riverC(z)-HW;   // 浦西岸线
const xrA = z=>riverC(z)+HW;   // 浦东岸线

// ---------- 发光点（光晕精灵）----------
const GL={p:[],c:[],s:[],ph:[],bl:[]};
function glow(x,y,z,hex,size=4,blink=0){GL.p.push(x,y,z);GL.c.push(((hex>>16)&255)/255,((hex>>8)&255)/255,(hex&255)/255);GL.s.push(size);GL.ph.push(Math.random());GL.bl.push(blink);}

/* ===================== 体素网格化：面剔除 + 顶点 AO ===================== */
const FACE=[
  {n:[1,0,0],u:[0,1,0],v:[0,0,1]},{n:[-1,0,0],u:[0,0,1],v:[0,1,0]},
  {n:[0,1,0],u:[0,0,1],v:[1,0,0]},{n:[0,-1,0],u:[1,0,0],v:[0,0,1]},
  {n:[0,0,1],u:[1,0,0],v:[0,1,0]},{n:[0,0,-1],u:[0,1,0],v:[1,0,0]},
];
const AOB=[0.52,0.7,0.86,1.0];
const CORN=[[0,0],[1,0],[1,1],[0,1]];
const c255=v=>v<0?0:v>255?255:v;

function meshGrid(g,o={}){
  const bx0=o.x0??0,bx1=o.x1??g.w,by0=o.y0??0,by1=o.y1??g.h,bz0=o.z0??0,bz1=o.z1??g.d;
  const jit=o.jit??0.055;
  const S={p:[],n:[],c:[],i:[],v:0}, E={p:[],n:[],c:[],d:[],i:[],v:0};
  const A=g.a,gw=g.w,gd=g.d;
  const sol=(x,y,z)=>g.get(x,y,z)!==0;
  for(let y=by0;y<by1;y++)for(let z=bz0;z<bz1;z++){
    let base=(y*gd+z)*gw;
    for(let x=bx0;x<bx1;x++){
      const c=A[base+x]; if(!c)continue;
      const pal=PAL[c],kind=pal[3],T=kind?E:S;
      const j=1+(hash3(x,y,z)-.5)*2*jit;
      const seed=hash3(x*3+1,y*5+2,z*7+3);
      for(let fi=0;fi<6;fi++){
        const f=FACE[fi],nx=x+f.n[0],ny=y+f.n[1],nz=z+f.n[2];
        if(g.get(nx,ny,nz)!==0)continue;
        const ao=[0,0,0,0];
        for(let k=0;k<4;k++){
          const a=CORN[k][0]?1:-1,b=CORN[k][1]?1:-1;
          const s1=sol(nx+f.u[0]*a,ny+f.u[1]*a,nz+f.u[2]*a)?1:0;
          const s2=sol(nx+f.v[0]*b,ny+f.v[1]*b,nz+f.v[2]*b)?1:0;
          const cc=sol(nx+f.u[0]*a+f.v[0]*b,ny+f.u[1]*a+f.v[1]*b,nz+f.u[2]*a+f.v[2]*b)?1:0;
          ao[k]=(s1&&s2)?0:3-(s1+s2+cc);
        }
        const ox=x+(f.n[0]>0?1:0),oy=y+(f.n[1]>0?1:0),oz=z+(f.n[2]>0?1:0);
        const b0=T.v;
        for(let k=0;k<4;k++){
          const a=CORN[k][0],b=CORN[k][1];
          T.p.push(ox+f.u[0]*a+f.v[0]*b,oy+f.u[1]*a+f.v[1]*b,oz+f.u[2]*a+f.v[2]*b);
          T.n.push(f.n[0]*127,f.n[1]*127,f.n[2]*127);
          if(kind===0){const m=AOB[ao[k]]*j;T.c.push(c255(pal[0]*m),c255(pal[1]*m),c255(pal[2]*m));}
          else{T.c.push(pal[0],pal[1],pal[2]);T.d.push(kind,seed,AOB[ao[k]],0);}
        }
        if(ao[0]+ao[2]>ao[1]+ao[3])T.i.push(b0+1,b0+2,b0+3,b0+1,b0+3,b0);
        else T.i.push(b0,b0+1,b0+2,b0,b0+2,b0+3);
        T.v+=4;
      }
    }
  }
  return {solid:toGeo(S,false),glow:toGeo(E,true),faces:S.v/4+E.v/4};
}
function toGeo(T,glowKind){
  if(!T.i.length)return null;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(T.p),3));
  g.setAttribute('normal',new THREE.BufferAttribute(new Int8Array(T.n),3,true));
  g.setAttribute('color',new THREE.BufferAttribute(new Uint8Array(T.c),3,true));
  if(glowKind)g.setAttribute('aData',new THREE.BufferAttribute(new Float32Array(T.d),4));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(T.i),1));
  g.computeBoundingSphere();g.computeBoundingBox();
  return g;
}

/* ===================== 材质 / 着色器 ===================== */
const U={
  uTime:{value:0},uNight:{value:0},uGlass:{value:new THREE.Color(.3,.5,.7)},uSunDir:{value:new THREE.Vector3(0,1,0)},uSunCol:{value:new THREE.Color(1,1,1)},
  uFogCol:{value:new THREE.Color(.6,.7,.9)},uFogNear:{value:260},uFogFar:{value:1250},uSky:{value:new THREE.Color(.5,.7,1)},uCam:{value:new THREE.Vector3()},
};
const FOGF=`

// —— 发光体素（窗户 / 霓虹 / 灯笼）——
const glowMat=new THREE.ShaderMaterial({
  uniforms:U,vertexColors:true,
  vertexShader:`
    attribute vec4 aData;
    varying vec3 vCol;varying vec4 vData;varying vec3 vN;varying vec3 vW;varying float vDepth;
    void main(){
      mat4 m=modelMatrix;
      #ifdef USE_INSTANCING
        m=m*instanceMatrix;
      #endif
      vec4 wp=m*vec4(position,1.);
      vW=wp.xyz;vN=normalize(mat3(m)*normal);vCol=color;vData=aData;

    }`,
  fragmentShader:`
    uniform float uTime,uNight,uFogNear,uFogFar;

    varying vec3 vCol;varying vec4 vData;varying vec3 vN;varying vec3 vW;varying float vDepth;
    ${FOGF}${HSV}
    float h11(float x){return fract(sin(x*91.345+7.13)*43758.5453);}
    void main(){
      float kind=vData.x,seed=vData.y,ao=vData.z;
      vec3 n=normalize(vN);
      float sunD=max(dot(n,uSunDir),0.);
      vec3 col;
      if(kind<2.5||kind>6.5){
        float prob=kind<1.5?0.62:(kind>6.5?1.0:0.9);
        float base=step(h11(seed*13.7),prob);
        float slot=floor(uTime/14.+seed*40.);
        float flip=step(0.95,h11(seed*57.1+slot*3.7))*(kind>6.5?0.:1.);
        float lit=abs(base-flip);
        vec3 glassDay=mix(uGlass,vCol*0.75,0.22)*(0.72+0.5*seed)*(0.75+0.3*ao);

      }else if(kind<3.5){
        col=vCol*(0.85+0.9*uNight)*(0.8+0.2*ao);
      }else if(kind<4.5){
        float hue=fract(seed*0.6+uTime*0.12+vW.y*0.012+vW.z*0.006);
        col=hsv2rgb(vec3(hue,0.78,1.))*(0.85+1.0*uNight);

        float bl=step(0.5,fract(uTime*0.55));

      }

    }`
});

// —— 水面：体素网格波纹 + 天空反射 + 夜间霓虹倒影 ——
const waterMat=new THREE.ShaderMaterial({
  uniforms:U,
  vertexShader:`varying vec3 vW;varying float vDepth;void main(){vec4 wp=modelMatrix*vec4(position,1.);vW=wp.xyz;vec4 mv=viewMatrix*wp;vDepth=-mv.z;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`
    uniform float uTime,uNight,uFogNear,uFogFar;
    uniform vec3 uSunDir,uSunCol,uFogCol,uSky,uCam;
    varying vec3 vW;varying float vDepth;
    ${FOGF}${HSV}
    float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    void main(){
      vec2 cell=floor(vW.xz);
      float t=uTime;
      float w=sin(cell.x*0.33+t*0.9+sin(cell.y*0.19+t*0.35)*2.2)+sin(cell.y*0.47-t*0.7+cell.x*0.11)+sin((cell.x+cell.y)*0.21+t*0.5);
      w=w*0.16+0.5;
      vec3 V=normalize(uCam-vW);
      float fres=pow(1.-clamp(V.y,0.,1.),2.6);
      vec3 deep=mix(vec3(.05,.34,.62),vec3(.015,.05,.16),uNight);
      vec3 shallow=mix(vec3(.16,.58,.86),vec3(.05,.13,.3),uNight);
      vec3 col=mix(deep,shallow,w);
      col=mix(col,uSky,fres*0.72);
      float r1=h21(cell+floor(t*0.6)),r2=h21(cell.yx*1.7+floor(t*0.6)+9.);
      vec3 n=normalize(vec3((r1-.5)*.7,1.,(r2-.5)*.7));
      vec3 H=normalize(V+uSunDir);
      float spec=pow(max(dot(n,H),0.),90.);
      col+=uSunCol*spec*1.6*step(0.,uSunDir.y);
      col+=vec3(1.)*step(0.965,r1)*0.10*(1.-uNight)*smoothstep(0.,0.4,uSunDir.y);
      // 夜间倒影：东岸彩色天际线、西岸金色外滩
      float rc=134.+8.*sin(vW.z/38.+0.6);
      float e=(vW.x-rc)/18.;
      float streak=step(0.8,h21(vec2(floor(cell.y*0.6),floor(cell.x*0.4+t*0.3))));
      vec3 pe=mix(vec3(1.,.35,.65),vec3(.3,.8,1.),step(.5,fract(floor(cell.y/9.)*0.37)));

    }`
});

const LEAF={

function bamboo(x,z,y=GY){const h=ri(5,8);for(let i=0;i<h;i++){setv(x,y+i,z,col(i%3?0x6fb84a:0x4a9a38));}setv(x,y+h,z,LEAF.lime[0]);setv(x+1,y+h-1,z,LEAF.lime[1]);setv(x-1,y+h-2,z,LEAF.lime[2]);}

// —— 立面（墙 + 窗阵）——
function facade(x,y,z,w,h,d,wall,win,o={}){
  box(x,y,z,w,h,d,wall);
  const rm=o.rowMod||2,ro=o.rowOff??1,cm=o.colMod||2,co=o.colOff??1,tp=o.topGap??1,bt=o.botGap??1;
  const win2=o.win2||win;
  for(let j=bt;j<h-tp;j++){
    if(j%rm!==ro%rm)continue;
    for(let i=1;i<w-1;i++){
      if(i%cm!==co%cm)continue;
      const wc=hash3(x+i,y+j,z)<.5?win:win2;
      if(o.front!==false)setv(x+i,y+j,z,wc);
      if(o.back!==false)setv(x+i,y+j,z+d-1,hash3(x+i,y+j,z+d)<.5?win:win2);
    }
    for(let i=1;i<d-1;i++){
      if(i%cm!==co%cm)continue;
      if(o.left!==false)setv(x,y+j,z+i,hash3(x,y+j,z+i)<.5?win:win2);
      if(o.right!==false)setv(x+w-1,y+j,z+i,hash3(x+w,y+j,z+i)<.5?win:win2);
    }
  }
}
// —— 屋顶 ——
function roofFlat(x,y,z,w,d,c,clutter=true){
  box(x,y,z,w,1,d,c);
  const pc=col(mixc(PAL[c][0]<<16|PAL[c][1]<<8|PAL[c][2],0xffffff,.25));
  for(let i=0;i<w;i++){setv(x+i,y+1,z,pc);setv(x+i,y+1,z+d-1,pc);}
  for(let i=0;i<d;i++){setv(x,y+1,z+i,pc);setv(x+w-1,y+1,z+i,pc);}
  if(clutter&&w>4&&d>4){
    const n=ri(1,3);
    for(let k=0;k<n;k++){
      const px=x+ri(1,w-3),pz=z+ri(1,d-3),t=ri(0,3);
      if(t===0){box(px,y+1,pz,2,2,2,col(0x9aa2ae));setv(px,y+3,pz,col(0x6a727e));}
      else if(t===1){cyl(px+1,pz+1,1.2,y+1,2,col(0xa77a55));}
      else if(t===2){box(px,y+1,pz,2,1,1,col(0xd0d4dc));box(px,y+1,pz+1,2,1,1,col(0xc0c6d0));}
      else{for(let q=0;q<4;q++)setv(px,y+1+q,pz,col(0xc84a3a));}
    }
  }
}
function roofHip(x,y,z,w,d,c,step=1,c2){
  let k=0;
  while(w-2*k*step>0&&d-2*k*step>0){box(x+k*step,y+k,z+k*step,w-2*k*step,1,d-2*k*step,(c2&&k===0)?c2:c);k++;}

}
function roofGable(x,y,z,w,d,c,axis='z',end){
  if(axis==='z'){let k=0;while(w-2*k>0){box(x+k,y+k,z,w-2*k,1,d,c);k++;}return k;}
  let k=0;while(d-2*k>0){box(x,y+k,z+k,w,1,d-2*k,c);k++;}return k;

// —— 中式飞檐屋顶 ——
function chineseRoof(x,y,z,w,d,c,trim,layers){
  const oh=2;let k=0;
  const maxk=Math.floor((Math.min(w,d)+2*oh)/2);
  const L=layers||Math.min(maxk,5);
  for(k=0;k<L;k++){
    const ex=Math.max(oh-k,0),ins=Math.max(k-oh,0);
    const xx=x-ex+ins,zz=z-ex+ins,ww=w+2*ex-2*ins,dd=d+2*ex-2*ins;
    if(ww<=0||dd<=0)break;
    box(xx,y+k,zz,ww,1,dd,c);
    if(k===0){
      for(let i=0;i<ww;i++){setv(xx+i,y-1,zz,trim);setv(xx+i,y-1,zz+dd-1,trim);}
      for(let i=0;i<dd;i++){setv(xx,y-1,zz+i,trim);setv(xx+ww-1,y-1,zz+i,trim);}
      // 翘角
      setv(xx-1,y+1,zz-1,trim);setv(xx+ww,y+1,zz-1,trim);setv(xx-1,y+1,zz+dd,trim);setv(xx+ww,y+1,zz+dd,trim);
      setv(xx,y+1,zz,c);setv(xx+ww-1,y+1,zz,c);setv(xx,y+1,zz+dd-1,c);setv(xx+ww-1,y+1,zz+dd-1,c);
    }
  }
  // 屋脊
  const ridge=y+L;const rw=Math.max(1,w-2*Math.max(L-oh,0)),rd=Math.max(1,d-2*Math.max(L-oh,0));
  const gx=x+Math.max(L-oh,0),gz=z+Math.max(L-oh,0);
  if(rw>=rd){box(gx,ridge,gz+Math.floor((rd-1)/2),rw,1,1,trim);setv(gx-1,ridge+1,gz+Math.floor((rd-1)/2),trim);setv(gx+rw,ridge+1,gz+Math.floor((rd-1)/2),trim);}
  else{box(gx+Math.floor((rw-1)/2),ridge,gz,1,1,rd,trim);setv(gx+Math.floor((rw-1)/2),ridge+1,gz-1,trim);setv(gx+Math.floor((rw-1)/2),ridge+1,gz+rd,trim);}
  return L;
}
const RED=col(0xcf2f2a),RED2=col(0xa8241f),GOLD=col(K.gold),WHITEW=col(0xf3f0e6),GRAYT=col(0x6c7488),GRAYT2=col(0x7a8498),STONEB=col(0xb8b6b0),LANT=col(0xff3a2a,3),LANT2=col(0xffb030,3);

function hall(x,z,w,d,h,roofC=GRAYT,y=GY,opts={}){

  for(let j=0;j<h;j++){for(const [px,pz] of [[x,z],[x+w-1,z],[x,z+d-1],[x+w-1,z+d-1]])setv(px,by+j,pz,RED);}
  for(let i=2;i<w-1;i+=3)for(let j=0;j<h;j++){setv(x+i,by+j,z,RED);setv(x+i,by+j,z+d-1,RED);}
  for(let i=2;i<d-1;i+=3)for(let j=0;j<h;j++){setv(x,by+j,z+i,RED);setv(x+w-1,by+j,z+i,RED);}

function pagodaTower(x,z,w,floors,roofC,y=GY){

// —— 通用楼宇 ——
const WALLS=[0xf0e2bc,0xe6a487,0xb8c6d2,0xb6cfa6,0xc4664c,0xe6bf60,0xefefea,0xc8b4dc,0x7fb9b8,0xd9a07a,0xe8d4a8,0xa9b7c6,0xf2c6b4];
function midRise(x,z,w,d,h,y=GY,o={}){

  const top=y+h;

  else if(rt===2){roofHip(x,top,z,w,d,bc);}

// 高层楼宇：多种顶部
const GLASSW={teal:col(0x2f9aa8),blue:col(0x2e6fb8),dark:col(0x34445e),gold:col(0xc9a24a),silver:col(0x9fb0c2),green:col(0x3a9a7a),pink:col(0xc4708e),white:col(0xdcdfe6),copper:col(0xb8734a),slate:col(0x5a6a80)};

/* ===================== 地形规划：河流 / 道路 / 广场 ===================== */
const TOP=new Uint16Array(W*D),RAISE=new Uint8Array(W*D),WAT=new Uint8Array(W*D),OCC=new Uint8Array(W*D),TYP=new Uint8Array(W*D);
// TYP: 1 路 2 人行/广场 3 绿地 4 滨江步道
const ix=(x,z)=>z*W+x;
const grassCols=[K.grass1,K.grass2,K.grass3,K.grass4].map(h=>col(h));
const grassAt=(x,z)=>{const n=vnoise(x*.16,z*.16)*.65+hash2(x,z)*.35;return grassCols[Math.min(3,Math.floor(n*4))];};
const CASPH=col(K.asphalt),CASPH2=col(K.asphalt2),CLINE=col(K.line),CCURB=col(K.curb),CPAVE=[col(K.pave1),col(K.pave2)],CPAVE3=col(K.pave3),CPLAZA=col(K.plaza),CSTONE=col(K.stone),CSTONED=col(K.stoneDk);
const paveAt=(x,z)=>(((x>>1)+(z>>1))&1)?CPAVE[0]:CPAVE[1];
const CNANJ=[col(0xe9d7bd),col(0xdcc3a2)],CNANJL=col(0xc9584a);

function paintRect(x0,z0,x1,z1,c,raise=0,typ=2){
  x0=Math.max(0,Math.floor(x0));z0=Math.max(0,Math.floor(z0));x1=Math.min(W,Math.ceil(x1));z1=Math.min(D,Math.ceil(z1));
  for(let z=z0;z<z1;z++)for(let x=x0;x<x1;x++){const i=ix(x,z);TOP[i]=typeof c==='function'?c(x,z):c;RAISE[i]=raise;TYP[i]=typ;WAT[i]=0;}
}
function reserve(x0,z0,x1,z1){x0=Math.max(0,Math.floor(x0));z0=Math.max(0,Math.floor(z0));x1=Math.min(W,Math.ceil(x1));z1=Math.min(D,Math.ceil(z1));for(let z=z0;z<z1;z++)for(let x=x0;x<x1;x++)OCC[ix(x,z)]=1;}
function isFree(x0,z0,x1,z1){
  if(x0<0||z0<0||x1>W||z1>D)return false;
  for(let z=z0;z<z1;z++)for(let x=x0;x<x1;x++){const i=ix(x,z);if(OCC[i]||WAT[i]||TYP[i]===1)return false;}
  return true;
}
function paintCirc(cx,cz,r,c,raise=0,typ=2){for(let z=Math.floor(cz-r);z<=cz+r;z++)for(let x=Math.floor(cx-r);x<=cx+r;x++){if(x<0||z<0||x>=W||z>=D)continue;const dx=x+.5-cx,dz=z+.5-cz;if(dx*dx+dz*dz<=r*r){const i=ix(x,z);TOP[i]=typeof c==='function'?c(x,z):c;RAISE[i]=raise;TYP[i]=typ;WAT[i]=0;}}}

// 街道定义（起点,宽度）
const NS_P=[[4,4],[28,4],[52,4]];
const EW_P=[[4,4],[28,4],[38,4],[60,4],[82,6],[110,4],[134,4],[158,4],[184,8]];
const NS_E=[[207,4],[240,4]];
const EW_E=[[46,4],[102,6],[154,4],[184,8]];
const inSt=(v,list)=>{for(let k=0;k<list.length;k++)if(v>=list[k][0]&&v<list[k][0]+list[k][1])return k;return -1;};
const NANJ_Z=[82,88];

function planTerrain(){
  for(let z=0;z<D;z++)for(let x=0;x<W;x++){
    const i=ix(x,z),cx=x+.5,cz=z+.5,rc=riverC(cz);
    const dW=(rc-HW)-cx,dE=cx-(rc+HW);
    const river=Math.abs(cx-rc)<HW;
    const creek=(cz>=32&&cz<38&&cx<rc-HW+2);
    TOP[i]=grassAt(x,z);TYP[i]=3;RAISE[i]=0;
    if(river){WAT[i]=1;continue;}
    if(dW>0){
      if(creek){
        const br=(dW>=11&&dW<17)||(dW>=35&&dW<39)||(dW>=39&&inSt(x,NS_P)>=0);
        if(!br){WAT[i]=1;continue;}
        TOP[i]=CASPH;TYP[i]=1;continue;
      }
      if(dW<1){TOP[i]=CSTONED;RAISE[i]=2;TYP[i]=4;}
      else if(dW<9){TOP[i]=paveAt(x,z);RAISE[i]=1;TYP[i]=4;}
      else if(dW<11){TYP[i]=3;}
      else if(dW<17){TOP[i]=(dW>=13&&dW<14&&(z&3)<2)?CLINE:CASPH;TYP[i]=1;}
      else if(dW<19){TOP[i]=CCURB;TYP[i]=2;}
      else if(dW<35){TOP[i]=CPLAZA;TYP[i]=2;}
      else if(dW<39){TOP[i]=(dW>=36.5&&dW<37.5&&(z&3)<2)?CLINE:CASPH;TYP[i]=1;}
      else{ // 浦西腹地
        TOP[i]=grassAt(x,z);TYP[i]=3;
        const ns=inSt(x,NS_P),ew=inSt(z,EW_P);
        if(ns>=0||ew>=0){
          let c=CASPH;
          if(ew===4){c=CNANJ[((x>>1)+(z>>1))&1];TYP[i]=2;if(z===84||z===85)c=CNANJL;}
          else{
            TYP[i]=1;
            if(ns>=0&&ew<0&&x===NS_P[ns][0]+2&&(z&3)<2)c=CLINE;
            if(ew>=0&&ns<0&&z===EW_P[ew][0]+2&&(x&3)<2)c=CLINE;
          }
          TOP[i]=c;
        }else{ // 街区铺装
          TOP[i]=CPLAZA;TYP[i]=2;
        }
      }
      // 南北向 Nanjing 路直达外滩
      if(z>=NANJ_Z[0]&&z<NANJ_Z[1]&&dW>=17&&dW<39){TOP[i]=CNANJ[((x>>1)+(z>>1))&1];if(z===84||z===85)TOP[i]=CNANJL;TYP[i]=2;}
    }else if(dE>0){
      if(dE<1){TOP[i]=CSTONED;RAISE[i]=2;TYP[i]=4;}
      else if(dE<12){TOP[i]=(dE>3&&dE<9)?grassAt(x,z):paveAt(x,z);RAISE[i]=1;TYP[i]=(dE>3&&dE<9)?3:4;}
      else if(dE<18){TOP[i]=(dE>=14.5&&dE<15.5&&(z&3)<2)?CLINE:CASPH;TYP[i]=1;}
      else if(dE<20){TOP[i]=CCURB;TYP[i]=2;}
      else{
        TOP[i]=grassAt(x,z);TYP[i]=3;
        const ns=inSt(x,NS_E),ew=inSt(z,EW_E);
        if(ns>=0||ew>=0){
          let c=CASPH;TYP[i]=1;
          if(ns>=0&&ew<0&&x===NS_E[ns][0]+2&&(z&3)<2)c=CLINE;
          if(ew>=0&&ns<0&&z===EW_E[ew][0]+EW_E[ew][1]/2-1&&(x&3)<2)c=CLINE;
          TOP[i]=c;
        }else{TOP[i]=CPLAZA;TYP[i]=2;}
      }
    }
    // 卢浦大桥引道
    if(z>=184&&z<192&&!river){TOP[i]=(z===187&&(x&3)<2)?CLINE:CASPH;TYP[i]=1;RAISE[i]=0;WAT[i]=0;}
  }
  // 河岸/河道两侧：把靠水的草地边缘换成石岸
  for(let z=1;z<D-1;z++)for(let x=1;x<W-1;x++){
    const i=ix(x,z);if(WAT[i]||TYP[i]!==3)continue;
    if(WAT[i-1]||WAT[i+1]||WAT[i-W]||WAT[i+W])TOP[i]=CSTONE;
  }
}

function voxelizeTerrain(){
  const soil=[col(K.soil1),col(K.soil2),col(K.soil3)],rock=[col(K.rock1),col(K.rock2),col(K.rock3),col(K.rock4)];
  const wc=[col(K.water3),col(K.water2),col(K.water1)];
  for(let z=0;z<D;z++)for(let x=0;x<W;x++){
    const i=ix(x,z);
    const nx=(x+.5-W/2)/(W/2),nz=(z+.5-D/2)/(D/2),r=Math.max(Math.abs(nx),Math.abs(nz));
    let yMin=Math.round((GY-4)*Math.pow(r,1.55)+(vnoise(x*.13,z*.13)-.5)*5-(vnoise(x*.4,z*.4))*1.5);
    yMin=clamp(yMin,0,GY-4);
    for(let y=yMin;y<=GY-5;y++){const t=hash3(x,y,z);const band=Math.floor((y+Math.floor(vnoise(x*.1,z*.1)*3))/3);
      setv(x,y,z,y>=GY-8?soil[(t*3)|0]:rock[(band+(t>.85?1:0))%4]);}
    if(WAT[i]){for(let k=0;k<3;k++)setv(x,GY-4+k,z,wc[k]);}
    else{
      setv(x,GY-4,z,soil[1]);setv(x,GY-3,z,soil[0]);setv(x,GY-2,z,soil[2]);
      const rs=RAISE[i];
      setv(x,GY-1,z,rs>0?CSTONE:TOP[i]);
      for(let k=0;k<rs;k++)setv(x,GY+k,z,k===rs-1?TOP[i]:CSTONE);
    }
  }
}

// —— 东方明珠 ——
function pearlTower(cx,cz){
  const y0=GY;
  const PK=[col(0xff4f9a),col(0xff7cb8),col(0xd8388e)],PURP=col(0x9a3cc0),SIL=col(0xdfe3ec),SILD=col(0x9aa2b4);

  const legs=[];
  for(let k=0;k<3;k++){
    const a=k*Math.PI*2/3+Math.PI/6;legs.push(a);
    for(let s=0;s<=44;s++){const t=s/44,r=lerp(7.4,2.4,Math.pow(t,.9)),yy=y0+4+t*15;box(Math.floor(cx+Math.cos(a)*r-1),Math.floor(yy),Math.floor(cz+Math.sin(a)*r-1),2,1,2,t>.85?SIL:col(0xe9ecf3));}
  }

  box(Math.floor(cx)-1,y0+29,Math.floor(cz)-1,2,26,2,col(0xb6bccb));
  pearl(cx,y0+58.5,cz,5.2,true);glow(cx,y0+58.5,cz,0xff60b0,18);
  box(Math.floor(cx)-1,y0+63,Math.floor(cz)-1,2,9,2,col(0xb6bccb));
  for(const a of legs){const px=Math.floor(cx+Math.cos(a)*2.6),pz=Math.floor(cz+Math.sin(a)*2.6);for(let y=y0+63;y<y0+71;y++)setv(px,y,pz,SIL);}
  pearl(cx,y0+74,cz,2.8,false);glow(cx,y0+74,cz,0xff70b8,9);
  const sx=Math.floor(cx),sz=Math.floor(cz);
  for(let i=0;i<22;i++)setv(sx,y0+77+i,sz,i%5<2?RED:SIL);
  setv(sx,y0+99,sz,BEACON);glow(sx+.5,y0+100,sz+.5,0xff2030,7,1);

  const ry=y0+7;

  for(let k=0;k<12;k++){const a=k*Math.PI/6;const px=Math.floor(cx+Math.cos(a)*17.6),pz=Math.floor(cz+Math.sin(a)*17.6);for(let y=y0;y<ry;y++)setv(px,y,pz,col(0xd0d4dc));}

// —— 上海中心（扭转 632m）——
function shanghaiTower(cx,cz){
  const y0=GY,TH=124;
  const SP=col(0xc6ced8),CORE=col(0x6d7c90),GL=WINL.cool,GL2=col(0x90ccf8,7);
  const tri=(px,pz,a,c,rot)=>{const ang=Math.atan2(pz,px),rad=Math.hypot(px,pz);let m=(((ang-rot-Math.PI/3)%(2*Math.PI/3))+2*Math.PI/3)%(2*Math.PI/3);const dl=m-Math.PI/3;const Rb=a/Math.cos(dl);return {ins:rad<=Math.min(Rb,c),dl};};
  for(let t=0;t<TH;t++){
    const u=t/TH;
    let a=6.4*(1-0.64*Math.pow(u,1.08));
    if(t>TH-9)a*=1-(t-(TH-9))*.07;
    const c=a*1.6,rot=u*Math.PI*.78;
    const R=Math.ceil(c)+2;
    for(let dz=-R;dz<=R;dz++)for(let dx=-R;dx<=R;dx++){
      const px=dx+.5,pz=dz+.5;
      if(!tri(px,pz,a,c,rot).ins)continue;
      const edge=!tri(px+1,pz,a,c,rot).ins||!tri(px-1,pz,a,c,rot).ins||!tri(px,pz+1,a,c,rot).ins||!tri(px,pz-1,a,c,rot).ins;
      let cc=CORE;
      if(edge){
        const s=tri(px,pz,a,c,rot);
        const vert=Math.abs(s.dl)>Math.PI/3-0.11;
        if(vert)cc=RAINBOW;
        else if(t%24===23)cc=SP;
        else if(t%6===5)cc=SP;
        else cc=((dx+dz+t)&1)?GL:GL2;
      }
      setv(Math.floor(cx)+dx,y0+t,Math.floor(cz)+dz,cc);
    }
  }
  const sx=Math.floor(cx),sz=Math.floor(cz);
  for(let i=0;i<14;i++)setv(sx,y0+TH+i,sz,i<4?SP:col(0xe4e8f0));

function swfc(cx,cz){

  for(let t=0;t<TH;t++){
    const u=t/TH,half=8.2-3.4*Math.pow(u,1.02);
    const R=Math.ceil(half)+1;
    for(let dz=-R;dz<=R;dz++)for(let dx=-R;dx<=R;dx++){
      const px=dx+.5,pz=dz+.5;

  for(let dz=-5;dz<=5;dz++)for(let dx=-5;dx<=5;dx++){if(getv(X+dx,y0+96,Z+dz)===0&&getv(X+dx,y0+95,Z+dz)!==0&&getv(X+dx,y0+95,Z+dz)!==RAINBOW)setv(X+dx,y0+96,Z+dz,RAINBOW);}
  glow(cx,y0+86,cz,0x60c8ff,22);glow(cx,y0+40,cz,0x80b0ff,14);
  box(X-11,y0,Z-11,22,2,22,col(K.pave3));
  facade(X-8,y0+2,Z-8,16,3,16,col(0x8aa0b8),WIN.offC);roofFlat(X-8,y0+5,Z-8,16,16,col(0xa8b8c8),false);

function lupuBridge(zc=188){
  const xa=Math.floor(xlA(zc))-3,xb=Math.ceil(xrA(zc))+3,mid=(xa+xb)/2,half=(xb-xa)/2;
  const dy=GY+5,RISE=24;
  const REDS=col(0xe23a2c),DECK=col(0x484c58),RAIL=col(0xd0d4dc),HANG=col(0xeadfd0);
  const rampL=14;
  const deckAt=x=>{if(x<xa)return Math.max(GY-1,dy-Math.ceil((xa-x)/2.4));if(x>xb)return Math.max(GY-1,dy-Math.ceil((x-xb)/2.4));return dy;};
  for(let x=xa-rampL-2;x<=xb+rampL+2;x++){
    const y=deckAt(x);
    if(y<=GY-1)continue;
    for(let z=zc-4;z<zc+4;z++){setv(x,y,z,(z===zc-1&&(x&3)<2)?CLINE:DECK);
      // 引桥支撑
      if(x<xa||x>xb){for(let yy=GY;yy<y;yy++)setv(x,yy,z,col(0x9a9ea6));}}
    // 栏杆
    setv(x,y+1,zc-4,RAIL);setv(x,y+1,zc+3,RAIL);
    if(x%6===0){setv(x,y+2,zc-4,NEON.white);setv(x,y+2,zc+3,NEON.white);}
    // 桥墩 (水中)
    if(x===xa||x===xb||x===Math.round(mid)){for(let z of [zc-3,zc+2])for(let yy=GY-4;yy<y;yy++){if(x===Math.round(mid))continue;setv(x,yy,z,col(0xb8bcc4));setv(x+1,yy,z,col(0xb8bcc4));}}
  }
  // 拱肋 + 吊杆
  for(const zr of [zc-4,zc+3]){
    for(let x=xa;x<=xb;x++){
      const q=(x-mid)/half,yy=dy+1+Math.round(RISE*(1-q*q));
      box(x,yy,zr,1,2,1,REDS);setv(x,yy-1,zr,RAINBOW);
      if((x-xa)%4===2){for(let y=dy+1;y<yy-1;y++)setv(x,y,zr,HANG);}
    }
  }
  // 横撑
  for(let x=xa+6;x<=xb-6;x+=6){const q=(x-mid)/half,yy=dy+1+Math.round(RISE*(1-q*q));for(let z=zc-3;z<zc+3;z++)setv(x,yy,z,REDS);}
  glow(mid,dy+RISE,zc,0xff5040,14);
}

function lots(x0,z0,x1,z1,maxS,out){
  const w=x1-x0,d=z1-z0;
  if(w>maxS&&w>=d){const c=x0+Math.floor(w*rr(.42,.58));lots(x0,z0,c,z1,maxS,out);lots(c,z0,x1,z1,maxS,out);}
  else if(d>maxS){const c=z0+Math.floor(d*rr(.42,.58));lots(x0,z0,x1,c,maxS,out);lots(x0,c,x1,z1,maxS,out);}
  else out.push([x0,z0,x1,z1]);
}
const HR_STYLES=['flat','stepped','pyramid','slant','crown','twin','cyl','dome','stepped','flat'];
function fillBlock(x0,z0,x1,z1,zone){
  x0=Math.floor(x0);x1=Math.floor(x1);
  if(x1-x0<7||z1-z0<7)return;
  const L=[];lots(x0,z0,x1,z1,zone.maxLot||15,L);
  for(const [a,b,c,d] of L){
    const lx=a+1,lz=b+1,w=c-a-2,dd=d-b-2;if(w<5||dd<5)continue;
    if(!isFree(lx,lz,lx+w,lz+dd))continue;
    const mx=lx+w/2,mz=lz+dd/2,dist=Math.hypot(mx-zone.cx,mz-zone.cz),cf=clamp(1-dist/zone.rad,0,1);
    const r=rnd();
    if(r<zone.park){ // 小公园
      paintRect(lx,lz,lx+w,lz+dd,(x,z)=>grassAt(x,z),0,3);
      for(let k=0;k<Math.max(2,(w*dd)/16);k++){const x=ri(lx,lx+w-1),z=ri(lz,lz+dd-1);tree(x,z,pick(['green','lime','cherry','ginkgo','green']));}
      reserve(lx,lz,lx+w,lz+dd);continue;
    }
    reserve(lx-1,lz-1,lx+w+1,lz+dd+1);
    if(zone.kind==='puxi'&&r<zone.park+zone.shik*(1-cf*.6)&&w>=9&&dd>=9){shikumen(lx,lz,w,dd);continue;}
    const tall=zone.kind==='pudong'?(r>zone.park+.12):(r>0.68-cf*.15);
    if(tall&&w>=6&&dd>=6){
      const h=Math.floor(zone.hMin+rnd()*zone.hVar+cf*zone.hCen*(0.4+rnd()*.7));
      const st=pick(HR_STYLES);
      highRise(lx,lz,w,dd,h,(st==='twin'&&w<8)?'flat':st,GY,{rowMod:rnd()<.3?1:2});
    }else{
      midRise(lx,lz,w,dd,Math.floor(4+rnd()*(5+cf*zone.midCen)),GY);
    }
  }
}

function dressStreets(){
  for(let z=1;z<D-1;z++)for(let x=1;x<W-1;x++){
    const i=ix(x,z);
    if(WAT[i]||TYP[i]===1)continue;

    if(getv(x,y,z)!==0)continue;
    if(RAISE[i]===2)continue;
    const nearRoad=TYP[i-1]===1||TYP[i+1]===1||TYP[i-W]===1||TYP[i+W]===1;
    const rc=riverC(z+.5),dW=(rc-HW)-(x+.5),dE=(x+.5)-(rc+HW);
    if(nearRoad&&(TYP[i]===2||TYP[i]===3)&&!(z>=NANJ_Z[0]-1&&z<=NANJ_Z[1])){
      if(((x+z*3)%5+5)%5===0&&hash2(x,z)>.15){
        const r=hash2(x,z+9);tree(x,z,r<.62?'green':r<.8?'ginkgo':r<.9?'lime':'cherry',y);

      if(((x*3+z)%9+9)%9===4&&hash2(x,z)>.5){lamp(x,z,y,3);continue;}
    }
    // 外滩步道
    if(dW>0&&dW<11){
      if(TYP[i]===4&&dW>7.3&&dW<8.3&&z%8===0)lamp(x,z,y,4);
      else if(TYP[i]===3&&dW>9&&dW<10&&z%5===2&&z>3&&(z<30||z>40))tree(x,z,'green',y,1.15);
      else if(TYP[i]===4&&dW>3&&dW<4&&z%16===8)bench(x,z,y);

    if(dE>0&&dE<12){

      else if(TYP[i]===3&&hash2(x,z)>.94){const r=hash2(x+3,z);tree(x,z,r<.35?'cherry':r<.6?'ginkgo':r<.8?'maple':'green',y);}

  // 南京路霓虹
  const cols=[0xff3f9a,0x40e0ff,0xffd84a,0x5fff9a,0xb070ff,0xff7a3a];
  for(let x=10,k=0;x<74;x+=6,k++){

}

function loopPath(offW,offE,zN,zS){
  const R=(offE-offW)/2,mid=(offE+offW)/2,LS=zS-zN,arc=Math.PI*R,tot=2*LS+2*arc;
  const fn=s=>{
    s=((s%tot)+tot)%tot;
    if(s<LS){const z=zN+s;return [riverC(z)+offW,z];}
    s-=LS;
    if(s<arc){const p=s/arc*Math.PI,cx=riverC(zS)+mid;return [cx-R*Math.cos(p),zS+R*Math.sin(p)];}
    s-=arc;
    if(s<LS){const z=zS-s;return [riverC(z)+offE,z];}
    s-=LS;const p=s/arc*Math.PI,cx=riverC(zN)+mid;return [cx+R*Math.cos(p),zN-R*Math.sin(p)];
  };
  return {fn,tot};
}

    ['东方明珠','Oriental Pearl',188,GY+104,62],['上海中心','Shanghai Tower',224,GY+142,90],['环球金融中心','SWFC',192,GY+104,124],['金茂大厦','Jin Mao',192,GY+86,90],
    ['外滩','The Bund',xlA(105)-28,GY+16,105],['豫园','Yu Garden',40,GY+16,150],['卢浦大桥','Lupu Bridge',134,GY+34,188],['世博中国馆','China Pavilion',208,GY+24,170],
    ['人民广场','People\'s Square',50,GY+14,112],['静安寺','Jing\'an Temple',27,GY+20,60],['摩天轮','Ferris Wheel',184,GY+28,24],['外白渡桥','Waibaidu Bridge',xlA(35)-11,GY+6,35],
  ]);
  resize();applyTime(ST.t);
  prog(1,'完成');
  setTimeout(()=>{const l=$('load');l.style.opacity=0;setTimeout(()=>l.remove(),900);},250);
  requestAnimationFrame(frame);
}

let last=performance.now(),elapsed=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;
  U.uTime.value=elapsed;
  if(ST.playing){ST.t=(ST.t+dt*ST.speed)%24;$('tslider').value=ST.t;}
  applyTime(ST.t);
  // 船
  for(const b of actors.boats){b.s+=b.speed*dt;const p=b.path.fn(b.s),q=b.path.fn(b.s+2);placeAt(b.m,p[0],WATER_Y-.9+Math.sin(elapsed*1.3+b.bob)*.07,p[1],q[0]-p[0],q[1]-p[1]);b.m.rotation.z=Math.sin(elapsed*.9+b.bob)*.012;}
  updateTraffic(dt);
  for(const m of actors.misc){
    if(m.type==='junk'){m.m.position.y=m.y0+Math.sin(elapsed*1.1+m.ph)*.08;m.m.rotation.z=Math.sin(elapsed*.8+m.ph)*.02;}
    else if(m.type==='ferris'){m.wheel.rotation.x+=dt*.16;for(const c of m.cabins){}const n=m.cabins.length;m.cabins.forEach((c,i)=>{const a=i/n*Math.PI*2;c.position.set(0,Math.cos(a)*m.R,Math.sin(a)*m.R);c.rotation.x=-m.wheel.rotation.x;});}
    else if(m.type==='blimp'){m.a+=dt*.03;const x=140+Math.cos(m.a)*110,z=100+Math.sin(m.a)*70;m.m.position.set(x,118+Math.sin(m.a*3)*3,z);m.m.rotation.y=Math.atan2(-Math.sin(m.a)*110,Math.cos(m.a)*70);}
    else if(m.type==='heli'){m.a+=dt*.22;const x=195+Math.cos(m.a)*62,z=95+Math.sin(m.a)*48;m.m.position.set(x,132+Math.sin(m.a*4)*1.5,z);m.m.rotation.y=Math.atan2(-Math.sin(m.a)*62,Math.cos(m.a)*48);m.m.userData.rot.rotation.y+=dt*30;}
  }
  for(const b of actors.balloons){b.a+=b.w*dt;b.m.position.set(b.cx+Math.cos(b.a)*b.r,b.cy+Math.sin(elapsed*.4+b.cx)*3,b.cz+Math.sin(b.a)*b.r*.8);b.m.rotation.y+=dt*.05;b.m.rotation.z=Math.sin(elapsed*.5+b.cx)*.04;}
  for(const c of actors.clouds){c.m.position.x+=c.v*dt;if(c.m.position.x>460)c.m.position.x=-200;}
  if(birds.mesh){birds.list.forEach((b,i)=>{b.a+=b.w*dt;const x=b.cx+Math.cos(b.a)*b.r,z=b.cz+Math.sin(b.a)*b.r*.7;const nx=-Math.sin(b.a)*Math.sign(b.w),nz=Math.cos(b.a)*.7*Math.sign(b.w);
    _d.position.set(x,b.y+Math.sin(elapsed*.7+b.ph)*3,z);_d.rotation.set(0,Math.atan2(nx,nz),0);const fl=.35+.65*Math.abs(Math.sin(elapsed*7+b.ph));_d.scale.set(1.1,fl*1.4,1.1);_d.updateMatrix();birds.mesh.setMatrixAt(i,_d.matrix);});birds.mesh.instanceMatrix.needsUpdate=true;}
  updateFireworks(dt,ST.night,ST.fire);
  updateCamera(dt);
  renderer.render(scene,camera);
  updateLabels();
  requestAnimationFrame(frame);
}

/* ===================== UI ===================== */
$('tslider').addEventListener('input',e=>{ST.t=parseFloat(e.target.value);ST.playing=false;$('play').classList.remove('on');$('play').textContent='▶ 流转';});
document.querySelectorAll('#time button[data-t]').forEach(b=>b.onclick=()=>{ST.t=parseFloat(b.dataset.t);$('tslider').value=ST.t;});
$('play').onclick=()=>{ST.playing=!ST.playing;$('play').classList.toggle('on',ST.playing);$('play').textContent=ST.playing?'⏸ 流转':'▶ 流转';};
$('bOrbit').onclick=e=>{ST.orbit=!ST.orbit;e.currentTarget.classList.toggle('on',ST.orbit);};
$('bFire').onclick=e=>{ST.fire=!ST.fire;e.currentTarget.classList.toggle('on',ST.fire);};
$('bLab').onclick=e=>{ST.labels=!ST.labels;e.currentTarget.classList.toggle('on',ST.labels);};
$('bShadow').onclick=e=>{ST.shadow=!ST.shadow;e.currentTarget.classList.toggle('on',ST.shadow);renderer.shadowMap.enabled=ST.shadow;sun.castShadow=ST.shadow;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});};
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();$('play').click();}
  const n=parseInt(e.key);if(n>=1&&n<=JUMPS.length)jump(n-1);
});

requestAnimationFrame(()=>requestAnimationFrame(()=>boot().catch(err=>{console.error(err);const d=$('err');d.style.display='block';d.textContent=(err&&err.stack)||String(err);})));

</script>
