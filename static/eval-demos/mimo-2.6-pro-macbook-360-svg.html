<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacBook Pro — 360° Draggable SVG</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(1200px 800px at 50% 35%, #2b2f3a 0%, #1b1e26 55%, #12141b 100%);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #hud {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    color: #cfd4de; font-size: 13px; letter-spacing: 3px; opacity: .85;
    pointer-events: none; transition: opacity .8s ease;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  #hud.hidden { opacity: 0; }
  #title {
    position: fixed; left: 50%; top: 28px; transform: translateX(-50%);
    color: #e8ebf2; font-size: 15px; letter-spacing: 6px; font-weight: 600;
    pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div id="title">MacBOOK PRO · SVG 360°</div>
<div id="hud">⟵  DRAG TO ROTATE  ⟶</div>

<svg id="stage" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#2f2a6e"/>
      <stop offset="35%" stop-color="#5b3aa8"/>
      <stop offset="65%" stop-color="#b1489c"/>
      <stop offset="100%" stop-color="#e8734a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <ellipse id="shadow" cx="500" cy="580" rx="260" ry="34" fill="url(#shadowGrad)"/>
  <g id="model"></g>
</svg>

<script>
"use strict";
/* =====================================================================
   MacBook Pro — 360° draggable, rendered 100% as SVG polygons.
   A tiny 3D engine projects box faces each frame; painter's algorithm
   sorts them by depth. Screen contents are bilinear/affine-mapped onto
   the projected display quad, so everything stays perspective-correct.
   ===================================================================== */

/* ---------- model dimensions (arbitrary units) ---------- */
const W = 30;        // width
const D = 21;        // base depth
const H = 1.15;      // base thickness
const LID = 20.5;    // lid length
const T = 0.75;      // lid thickness
const HINGE_Z = -D / 2 + 0.5;
const HINGE_Y = H;

/* ---------- projection constants ---------- */
const CX = 500, CY = 355, F = 150, SCALE = 12.6, PIVOT_Y = 9.5;

/* ---------- view state ---------- */
let yaw = -0.5, pitch = 0.32;
let vel = 0.35;                 // rad/s spin
let dragging = false, lastX = 0, lastY = 0, lastInput = -1e9;
let lidTarget = 1.83;           // open angle (radians, from flat) — 105°
let lidAngle = 0;
const t0 = performance.now();

/* ---------- tiny vec helpers ---------- */
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  mix: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]
};
function transform(p) {
  const x = p[0], y = p[1] - PIVOT_Y, z = p[2];
  const ca = Math.cos(yaw), sa = Math.sin(yaw);
  const xr = x * ca + z * sa;
  const zr = -x * sa + z * ca;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  return [xr, y * cp - zr * sp, y * sp + zr * cp];
}
/* rotate a direction (normal) — no pivot translation */
function transformDir(p) {
  const x = p[0], y = p[1], z = p[2];
  const ca = Math.cos(yaw), sa = Math.sin(yaw);
  const xr = x * ca + z * sa;
  const zr = -x * sa + z * ca;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  return [xr, y * cp - zr * sp, y * sp + zr * cp];
}
function project(t) {
  const s = F / (F - t[2]);
  return [CX + t[0] * s * SCALE, CY - t[1] * s * SCALE, t[2]];
}
function proj(p) { return project(transform(p)); }

/* bilinear point on a quad [c00, c10, c11, c01] (3D or 2D) */
function bilerp(q, u, v) {
  const a = q[0], b = q[1], c = q[2], d = q[3];
  const x = a[0] * (1 - u) * (1 - v) + b[0] * u * (1 - v) + c[0] * u * v + d[0] * (1 - u) * v;
  const y = a[1] * (1 - u) * (1 - v) + b[1] * u * (1 - v) + c[1] * u * v + d[1] * (1 - u) * v;
  return [x, y];
}

/* ---------- lighting ---------- */
const LIGHT = (() => { const l = [0.45, 0.78, 0.62]; const m = Math.hypot(...l); return l.map(x => x / m); })();
function shadeOf(normal, base) {
  const n = transformDir(normal);
  const d = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
  const rim = Math.max(0, n[2]) * 0.10;
  const k = 0.42 + 0.58 * d + rim;
  return `rgb(${Math.min(255, base[0] * k) | 0},${Math.min(255, base[1] * k) | 0},${Math.min(255, base[2] * k) | 0})`;
}

/* ---------- face factory: quad in order [c00, c10, c11, c01] ---------- */
function face(q3, normal, color, opts = {}) {
  return { q3, normal, color, ...opts };
}

/* =====================================================================
   MODEL — base box + keyboard deck + lid with animated hinge
   ===================================================================== */
function buildModel(lid) {
  const faces = [];
  const hw = W / 2, hd = D / 2;
  const silver = [216, 219, 224];

  /* ---- base box ---- */
  const topQ = [[-hw, H, hd], [hw, H, hd], [hw, H, -hd], [-hw, H, -hd]];       // u:L→R, v:front→back
  faces.push(face(topQ, [0, 1, 0], [222, 225, 230], { kind: 'deck' }));
  faces.push(face([[-hw, 0, hd], [hw, 0, hd], [hw, 0, -hd], [-hw, 0, -hd]], [0, -1, 0], [188, 192, 199]));
  faces.push(face([[-hw, 0, hd], [hw, 0, hd], [hw, H, hd], [-hw, H, hd]], [0, 0, 1], silver));   // front
  faces.push(face([[hw, 0, -hd], [-hw, 0, -hd], [-hw, H, -hd], [hw, H, -hd]], [0, 0, -1], silver)); // back
  const leftQ = [[-hw, 0, hd], [-hw, 0, -hd], [-hw, H, -hd], [-hw, H, hd]];   // u:front→back, v:bottom→top
  faces.push(face(leftQ, [-1, 0, 0], silver, { kind: 'sideL' }));
  faces.push(face([[hw, 0, -hd], [hw, 0, hd], [hw, H, hd], [hw, H, -hd]], [1, 0, 0], silver));

  /* ---- lid box (rotates around hinge) ---- */
  const dir = [0, Math.sin(lid), Math.cos(lid)];       // hinge → lid tip
  const nrm = [0, Math.cos(lid), -Math.sin(lid)];      // outer shell normal (screen = -nrm)
  const P0 = [0, HINGE_Y, HINGE_Z];
  const L = (xw, t, l) => V.add(V.add(V.add(P0, [xw, 0, 0]), V.scale(dir, l)), V.scale(nrm, t));

  // screen face (t = 0): u across width, v: hinge → tip
  const scrQ = [L(-hw, 0, 0), L(hw, 0, 0), L(hw, 0, LID), L(-hw, 0, LID)];
  faces.push(face(scrQ, V.scale(nrm, -1), [20, 20, 24], { kind: 'screen', emissive: true }));
  // outer shell (t = T)
  faces.push(face([L(-hw, T, 0), L(hw, T, 0), L(hw, T, LID), L(-hw, T, LID)], nrm, [210, 213, 219], { kind: 'lidOuter' }));
  // lid edges
  faces.push(face([L(-hw, 0, 0), L(hw, 0, 0), L(hw, T, 0), L(-hw, T, 0)], V.scale(dir, -1), [196, 200, 207]));
  faces.push(face([L(hw, 0, LID), L(-hw, 0, LID), L(-hw, T, LID), L(hw, T, LID)], dir, [196, 200, 207]));
  faces.push(face([L(-hw, 0, LID), L(-hw, 0, 0), L(-hw, T, 0), L(-hw, T, LID)], [-1, 0, 0], [204, 208, 214]));
  faces.push(face([L(hw, 0, 0), L(hw, 0, LID), L(hw, T, LID), L(hw, T, 0)], [1, 0, 0], [204, 208, 214]));

  /* ---- hinge barrel accent ---- */
  const hq = [L(-hw * 0.55, T, -0.1), L(hw * 0.55, T, -0.1), L(hw * 0.55, T + 0.5, -0.1), L(-hw * 0.55, T + 0.5, -0.1)];
  faces.push(face(hq, nrm, [165, 168, 175], { kind: 'hinge' }));

  return faces;
}

/* deck decorations are drawn as bilinear sub-quads of the top face */
function deckDecor(topQ) {
  const out = [];
  // keyboard well
  out.push({ q: sub(topQ, 0.045, 0.46, 0.955, 0.955), fill: 'rgb(52,54,60)' });
  // keys: 14 x 5 grid
  const rows = 5, cols = 14;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const u0 = 0.055 + (0.90 * c) / cols, u1 = 0.055 + (0.90 * (c + 0.82)) / cols;
      const v0 = 0.475 + (0.47 * r) / rows, v1 = 0.475 + (0.47 * (r + 0.78)) / rows;
      const tone = 38 + ((r * 7 + c * 13) % 3) * 5;
      out.push({ q: sub(topQ, u0, v0, u1, v1), fill: `rgb(${tone},${tone + 2},${tone + 8})` });
    }
  }
  // spacebar row hint
  out.push({ q: sub(topQ, 0.36, 0.40, 0.64, 0.445), fill: 'rgb(44,46,52)' });
  // trackpad
  out.push({ q: sub(topQ, 0.32, 0.05, 0.68, 0.36), fill: 'rgb(172,176,184)' });
  out.push({ q: sub(topQ, 0.325, 0.055, 0.675, 0.355), fill: 'rgb(183,187,195)' });
  // speaker grills
  for (let i = 0; i < 7; i++) {
    out.push({ q: sub(topQ, 0.012, 0.5 + i * 0.06, 0.035, 0.52 + i * 0.06), fill: 'rgb(70,72,80)' });
    out.push({ q: sub(topQ, 0.965, 0.5 + i * 0.06, 0.988, 0.52 + i * 0.06), fill: 'rgb(70,72,80)' });
  }
  return out;
}
function sub(q, u0, v0, u1, v1) {
  return [bilerp(q, u0, v0), bilerp(q, u1, v0), bilerp(q, u1, v1), bilerp(q, u0, v1)];
}

/* left side: two USB-C ports */
function sideDecor(faceQuad) {
  const out = [];
  out.push({ q: sub(faceQuad, 0.30, 0.40, 0.38, 0.62), fill: 'rgb(35,36,42)' });
  out.push({ q: sub(faceQuad, 0.44, 0.40, 0.52, 0.62), fill: 'rgb(35,36,42)' });
  return out;
}

/* =====================================================================
   RENDER
   ===================================================================== */
const modelEl = document.getElementById('model');
const shadowEl = document.getElementById('shadow');

function render(now) {
  /* ---- animation state ---- */
  const t = (now - t0) / 1000;
  const idle = (now - lastInput) / 1000;

  // lid opening animation (ease-out)
  const openT = Math.min(1, Math.max(0, (t - 0.15) / 1.3));
  const ease = 1 - Math.pow(1 - openT, 3);
  lidAngle = lidTarget * ease;

  // spin: inertia + auto-rotate when idle
  if (!dragging) {
    if (idle > 2 && openT >= 1) vel += (0.45 - vel) * 0.02;
    vel *= 0.995;
  }
  yaw += vel * (1 / 60);

  // gentle float
  const bob = Math.sin(t * 1.4) * 0.25;

  /* ---- build faces ---- */
  const faces = buildModel(lidAngle);
  const deck = deckDecor(faces[0].q3);
  const sides = sideDecor(faces[4].q3);

  /* ---- project & cull ---- */
  const drawn = [];
  for (const f of faces) {
    const n = transformDir(f.normal);
    if (f.emissive ? n[2] <= -0.05 : n[2] <= 0.02) continue;    // back-face cull
    const q2 = f.q3.map(p => {
      const tp = transform([p[0], p[1] + bob, p[2]]);
      return project(tp);
    });
    const zc = (q2[0][2] + q2[1][2] + q2[2][2] + q2[3][2]) / 4;
    drawn.push({ f, q2, zc });
  }
  drawn.sort((a, b) => a.zc - b.zc);   // painter: far → near

  /* ---- emit SVG ---- */
  const svg = [];
  let screenQuad = null;

  for (const { f, q2 } of drawn) {
    const pts = q2.map(p => `${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ');
    const fill = f.emissive ? 'rgb(16,16,20)' : shadeOf(f.normal, f.color);
    svg.push(`<polygon points="${pts}" fill="${fill}" stroke="${fill}" stroke-width="0.7"/>`);

    if (f.kind === 'deck') {
      for (const d of deck) {
        const dp = d.q.map(p => proj([p[0], p[1] + bob + 0.02, p[2]]));
        svg.push(`<polygon points="${dp.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}" fill="${d.fill}"/>`);
      }
    }
    if (f.kind === 'sideL') {
      for (const d of sides) {
        const dp = d.q.map(p => proj([p[0] - 0.03, p[1] + bob, p[2]]));
        svg.push(`<polygon points="${dp.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}" fill="${d.fill}"/>`);
      }
    }
    if (f.kind === 'hinge') {
      svg.push(`<polygon points="${pts}" fill="rgba(255,255,255,0.18)"/>`);
    }
    if (f.kind === 'lidOuter') {
      // brushed-metal sheen band on the shell
      const sh = sub(q2, 0.0, 0.18, 1.0, 0.30);
      svg.push(`<polygon points="${sh.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}" fill="rgba(255,255,255,0.10)"/>`);
    }
    if (f.kind === 'screen') screenQuad = q2;
  }

  /* ---- screen content (clipped to the projected display quad) ---- */
  if (screenQuad) {
    const q = screenQuad;
    const clipPts = q.map(p => `${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ');
    // affine basis for mapping (0..1000)^2 onto the quad (perspective-accurate enough for small bits)
    const [A, B, , Dp] = q;
    const m = [(B[0] - A[0]) / 1000, (B[1] - A[1]) / 1000, (Dp[0] - A[0]) / 1000, (Dp[1] - A[1]) / 1000, A[0], A[1]];
    const xf = `matrix(${m.map(x => x.toFixed(4)).join(',')})`;

    svg.push(`<clipPath id="scrClip"><polygon points="${clipPts}"/></clipPath>`);
    svg.push(`<g clip-path="url(#scrClip)">`);
    // wallpaper
    const inner = sub(q, 0.035, 0.035, 0.965, 0.94);
    svg.push(`<polygon points="${inner.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}" fill="url(#wallGrad)"/>`);
    // aurora blobs (bilinear → perspective correct)
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.9);
    svg.push(polyStr(sub(q, 0.10, 0.30, 0.55, 0.62), `rgba(255,120,190,${0.20 + 0.08 * pulse})`));
    svg.push(polyStr(sub(q, 0.45, 0.10, 0.92, 0.45), `rgba(120,110,255,${0.22 + 0.08 * (1 - pulse)})`));
    svg.push(polyStr(sub(q, 0.30, 0.55, 0.75, 0.88), 'rgba(255,170,90,0.16)'));
    // moving sheen sweep
    const sweep = ((t * 0.22) % 1.6) - 0.3;
    svg.push(polyStr(sub(q, sweep, 0, sweep + 0.16, 1), 'rgba(255,255,255,0.10)'));
    // dock
    svg.push(`<g transform="${xf}"><rect x="330" y="905" width="340" height="52" rx="18" fill="rgba(255,255,255,0.22)"/>`);
    for (let i = 0; i < 7; i++) {
      svg.push(`<rect x="${348 + i * 46}" y="915" width="34" height="34" rx="9" fill="rgba(255,255,255,${0.35 + 0.1 * Math.sin(t * 2 + i)})"/>`);
    }
    svg.push('</g>');
    // menu bar
    svg.push(`<g transform="${xf}"><rect x="0" y="8" width="1000" height="34" fill="rgba(0,0,0,0.28)"/>` +
      `<text x="24" y="32" font-size="24" fill="#fff" font-family="-apple-system,sans-serif"> Finder  File  Edit  View</text>` +
      `<text x="880" y="32" font-size="22" fill="#fff">100%</text></g>`);
    // notch
    svg.push(`<g transform="${xf}"><rect x="420" y="0" width="160" height="30" rx="12" fill="#0a0a0c"/>` +
      `<circle cx="552" cy="15" r="5" fill="#182430"/></g>`);
    svg.push('</g>');
    // bezel + brand text on lower bezel
    svg.push(polyStr(sub(q, 0.0, 0.94, 1.0, 1.0), 'rgb(14,14,17)'));
    svg.push(`<g transform="${xf}"><text x="500" y="972" font-size="22" text-anchor="middle" fill="#5c6069" letter-spacing="4" font-family="-apple-system,sans-serif">MacBook Pro</text></g>`);
    // glass glow
    svg.push(`<polygon points="${clipPts}" fill="rgba(120,140,255,0.07)" filter="url(#soft)"/>`);
    // screen glow into the scene
    svg.push(`<polygon points="${clipPts}" fill="rgba(150,120,255,${0.10 + 0.04 * pulse})" filter="url(#glow)"/>`);
  }

  modelEl.innerHTML = svg.join('');

  /* ---- ground shadow follows the footprint ---- */
  const basePts = [[-W / 2, 0, D / 2], [W / 2, 0, D / 2], [W / 2, 0, -D / 2], [-W / 2, 0, -D / 2]]
    .map(p => proj([p[0], p[1] + bob, p[2]]));
  const xs = basePts.map(p => p[0]), ys = basePts.map(p => p[1]);
  const rx = (Math.max(...xs) - Math.min(...xs)) * 0.62 + 40;
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2;
  const cy = (Math.max(...ys) + Math.min(...ys)) / 2 + 26;
  shadowEl.setAttribute('cx', cx.toFixed(1));
  shadowEl.setAttribute('cy', cy.toFixed(1));
  shadowEl.setAttribute('rx', rx.toFixed(1));
  shadowEl.setAttribute('ry', (rx * 0.14 + 8).toFixed(1));
  shadowEl.setAttribute('opacity', (0.85 + 0.1 * Math.sin(t * 1.4)).toFixed(2));

  requestAnimationFrame(render);
}
function polyStr(q, fill) {
  return `<polygon points="${q.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}" fill="${fill}"/>`;
}

/* =====================================================================
   INTERACTION — drag to spin 360°, vertical drag to tilt
   ===================================================================== */
const stage = document.getElementById('stage');
const hud = document.getElementById('hud');
let hudHidden = false;

function onDown(e) {
  dragging = true;
  stage.classList.add('dragging');
  lastX = e.clientX; lastY = e.clientY;
  lastInput = performance.now();
  stage.setPointerCapture(e.pointerId);
}
function onMove(e) {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  yaw += dx * 0.008;
  vel = dx * 0.008 * 8;                                   // fling velocity
  pitch = Math.max(-0.45, Math.min(0.6, pitch + dy * 0.005));
  lastInput = performance.now();
  if (!hudHidden) { hud.classList.add('hidden'); hudHidden = true; }
}
function onUp(e) {
  dragging = false;
  stage.classList.remove('dragging');
  lastInput = performance.now();
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
}
stage.addEventListener('pointerdown', onDown);
stage.addEventListener('pointermove', onMove);
stage.addEventListener('pointerup', onUp);
stage.addEventListener('pointercancel', onUp);

/* expose state for automated verification */
window.__mbp = {
  get yaw() { return yaw; },
  get pitch() { return pitch; },
  get lidAngle() { return lidAngle; },
  get polygons() { return modelEl.childNodes.length; },
  ready: true
};

requestAnimationFrame(render);
</script>
</body>
</html>
