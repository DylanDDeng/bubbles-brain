<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>堆雪人 · 体素冬日</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #cfe8fb; }
  canvas { display: block; }
  #app { position: fixed; inset: 0; }
  .ui { position: fixed; z-index: 10; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; user-select: none; }
  #title { top: 22px; left: 26px; pointer-events: none; }
  #title h1 {
    font-size: 30px; font-weight: 800; letter-spacing: 6px; color: #234a6b;
    text-shadow: 0 2px 0 rgba(255,255,255,.9), 0 0 22px rgba(255,255,255,.7);
  }
  #title h1 span { color: #e05a3a; }
  #title p {
    margin-top: 6px; font-size: 12.5px; letter-spacing: 3px; color: #3c6a8f;
    text-shadow: 0 1px 0 rgba(255,255,255,.8);
  }
  #panel { top: 22px; right: 26px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .btn {
    pointer-events: auto; cursor: pointer; border: 1px solid rgba(255,255,255,.75);
    background: rgba(255, 255, 255, .58); backdrop-filter: blur(8px);
    color: #234a6b; font-size: 13.5px; letter-spacing: 2px;
    padding: 9px 16px; border-radius: 999px; transition: all .25s ease;
    box-shadow: 0 4px 14px rgba(70, 110, 150, .25);
  }
  .btn:hover { background: rgba(255, 255, 255, .9); transform: translateY(-1px); }
  .btn.on { background: rgba(224, 90, 58, .82); color: #fff; border-color: #ffb59e; }
  #hint {
    bottom: 20px; left: 26px; font-size: 12px; letter-spacing: 2px;
    color: #3c6a8f; text-shadow: 0 1px 0 rgba(255,255,255,.8); pointer-events: none; line-height: 1.9;
  }
  #hint b { color: #e05a3a; font-weight: 600; }
  #fps {
    bottom: 20px; right: 26px; font-size: 11.5px; letter-spacing: 1.5px;
    color: #55809f; font-family: "SF Mono", Menlo, monospace; pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(180deg, #dff0fd 0%, #bcdcf5 100%);
    color: #234a6b; letter-spacing: 4px; font-size: 15px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: opacity .8s ease;
  }
  #loading .ball {
    width: 54px; height: 54px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ffffff, #dcecf8 65%, #a9cbe4);
    box-shadow: 0 10px 24px rgba(80, 120, 160, .35);
    animation: hop 1.1s ease-in-out infinite;
  }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  #loading.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>

<div id="loading" class="ui"><div class="ball"></div><div>堆雪人 · 生成中…</div></div>

<div id="title" class="ui">
  <h1>堆雪人<span>·</span>VOXEL SNOWMAN</h1>
  <p>三颗雪球 · 煤球笑脸 · 胡萝卜鼻 · 大礼帽 · 红围巾 · 会挥手</p>
</div>

<div id="panel" class="ui">
  <div class="btn" id="btnShake">🌬️ 摇一摇</div>
  <div class="btn on" id="btnSnow">❄️ 降雪中</div>
  <div class="btn on" id="btnSpin">🔄 自动环绕</div>
  <div class="btn" id="btnShot">📷 保存 PNG</div>
</div>

<div id="hint" class="ui">
  <b>拖拽</b> 旋转视角 &nbsp;·&nbsp; <b>滚轮</b> 缩放 &nbsp;·&nbsp; <b>右键拖拽</b> 平移<br>
  全场景纯程序化体素生成，无任何外部模型 / 贴图
</div>
<div id="fps" class="ui">-- FPS</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
'use strict';

// ============================================================
//  0. 基础工具 · 确定性随机 · 体素收集器
// ============================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rnd = mulberry32(20261221);
function rand(a, b) { return a + (b - a) * rnd(); }
function pick(arr) { return arr[Math.floor(rnd() * arr.length) % arr.length]; }

// 体素收集器：登记 {x,y,z,sx,sy,sz,color,rx,ry,rz}，最后烘焙成 InstancedMesh。
// 雪人单独一组收集器，放进可摆动的 snowmanGroup；世界（地面/树/杂物）静止烘焙。
var W_SOLID = [], W_GLOW = [];     // 世界
var S_SOLID = [], S_GLOW = [];     // 雪人（可整体晃动）

function box(list, x, y, z, sx, sy, sz, color, ry, rx, rz) {
  list.push({ x: x, y: y, z: z, sx: sx, sy: sy, sz: sz, color: color,
              rx: rx || 0, ry: ry || 0, rz: rz || 0 });
}
function vox(list, x, y, z, color) { box(list, x, y, z, 1, 1, 1, color); }

// 椭球体素填充：带表面随机缺口，模拟"手拍出来的雪球"质感
function snowBall(list, cx, cy, cz, rx, ry, rz, shades) {
  for (var x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
    for (var y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (var z = Math.floor(cz - rz); z <= Math.ceil(cz + rz); z++) {
        var dx = (x - cx) / rx, dy = (y - cy) / ry, dz = (z - cz) / rz;
        var d = dx * dx + dy * dy + dz * dz;
        if (d > 1) continue;
        if (d > 0.52 && rnd() < 0.07) continue;          // 表面小缺口
        vox(list, x, y, z, shades[Math.floor(rnd() * shades.length)]);
      }
}
// 通用实心球
function ball(list, cx, cy, cz, r, color) {
  snowBall(list, cx, cy, cz, r, r, r, [color]);
}
// 圆柱
function column(list, cx, cz, y0, y1, r, color) {
  var r2 = r * r;
  for (var y = y0; y < y1; y++)
    for (var x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
      for (var z = Math.floor(cz - r); z <= Math.ceil(cz + r); z++) {
        if ((x - cx) * (x - cx) + (z - cz) * (z - cz) <= r2) vox(list, x, y, z, color);
      }
}
// 椭球表面 z 值（用于贴脸/贴纽扣，保证浮在雪球表面）
function surfZ(cx, cy, cz, rx, ry, rz, x, y) {
  var t = 1 - ((x - cx) / rx) * ((x - cx) / rx) - ((y - cy) / ry) * ((y - cy) / ry);
  return cz + rz * Math.sqrt(Math.max(t, 0));
}

// ============================================================
//  1. 色板
// ============================================================
var C = {
  snow: [0xffffff, 0xf7fbff, 0xedf5fd, 0xe3eef9],       // 雪球斑驳白
  snowShade: 0xd8e7f4, snowDim: 0xc9dcee, snowDeep: 0xb7cee2,
  coal: 0x272b33, coalHi: 0x3a4049, glint: 0xffffff,
  carrot: 0xff8c1a, carrotDark: 0xe5730a,
  cheek: 0xffa6b8,
  hat: 0x23262d, hatBand: 0xd9412e, hatTop: 0x2e323b,
  scarf: 0xd9412e, scarfLight: 0xf2ede0,
  twig: 0x6b4a2c, twigDark: 0x54381f,
  lantern: 0xffb84d, lanternGlow: 0xffd98f, lanternFrame: 0x4a3a28,
  robinBody: 0x5a4632, robinBreast: 0xe0603a, robinBeak: 0xffc93c,
  tree: 0x2f7a46, treeDark: 0x256339, trunk: 0x6b4a2c,
  bucket: 0xd9412e, bucketDark: 0xa8301f, bucketHandle: 0x8a97a3,
  fence: 0xb89a72, fenceDark: 0x9a7c56,
  sky: 0x5ea8e0, fogC: 0xa9d5f2, sun: 0xfff3b8, cloud: 0xffffff
};

// ============================================================
//  2. 世界：雪地 · 脚印 · 杉树 · 小红桶 · 木栅栏
// ============================================================
function buildGround() {
  // 雪地大底
  box(W_SOLID, 0, -2, 0, 240, 4, 240, C.snowShade);
  box(W_SOLID, 0, 0.1, 0, 238, 0.6, 238, 0xf2f8fe);
  // 起伏雪包
  for (var i = 0; i < 130; i++) {
    var x = rand(-115, 115), z = rand(-115, 115);
    if (Math.abs(x) < 22 && Math.abs(z) < 22) continue;      // 让开雪人周围
    box(W_SOLID, x, 0.5, z, rand(2, 7), rand(0.5, 1.6), rand(2, 7), pick(C.snow));
  }
  // 一串小脚印（通向雪人）
  for (var s = 0; s < 9; s++) {
    var fz = 40 - s * 3.4;
    var side = s % 2 ? 1.6 : -1.6;
    box(W_SOLID, side + Math.sin(s * 0.9) * 0.6, 0.28, fz, 1.5, 0.3, 2.2, C.snowDeep);
    box(W_SOLID, side + Math.sin(s * 0.9) * 0.6, 0.4, fz - 0.3, 1.1, 0.16, 1.4, 0xa9c3da);
  }
}
function buildTrees() {
  function fir(x, z, scale) {
    box(W_SOLID, x, 3 * scale, z, 2.2 * scale, 6 * scale, 2.2 * scale, C.trunk);
    var y = 5 * scale;
    var radii = [6.5, 5.2, 3.8, 2.4];
    for (var i = 0; i < radii.length; i++) {
      var r = radii[i] * scale, h = 5 * scale;
      // 锥形绿叶体素
      for (var yy = 0; yy < h; yy++) {
        var rr = r * (1 - yy / h * 0.55);
        column(W_SOLID, x, z, y + yy, y + yy + 1, rr, i % 2 ? C.treeDark : C.tree);
      }
      // 顶上积雪盖
      column(W_SOLID, x, z, y + h, y + h + 0.9, r * 0.5, 0xffffff);
      column(W_SOLID, x, z, y + h + 0.9, y + h + 1.5, r * 0.26, 0xf4faff);
      y += h * 0.78;
    }
    box(W_SOLID, x, y + 1.4, z, 1, 2.4, 1, 0xffffff);
  }
  fir(-30, -18, 1.35);
  fir(-42, -34, 0.95);
  fir(34, -26, 1.1);
  fir(46, -8, 0.7);
}
function buildProps() {
  // 小红桶（滚雪球用的）倒扣在旁边
  var bx = 17, bz = 12;
  column(W_SOLID, bx, bz, 0, 7, 4, C.bucket);
  column(W_SOLID, bx, bz, 6.4, 7, 4.3, C.bucketDark);
  column(W_SOLID, bx, bz, 0.4, 1, 3.4, C.bucketDark);
  box(W_SOLID, bx, 7.8, bz, 8.6, 0.7, 0.7, C.bucketHandle, 0, 0, 0.3);
  // 桶沿积雪
  box(W_SOLID, bx + 2, 7.4, bz - 1, 3, 1, 3, pick(C.snow));

  // 备用树枝（雪人的"存货"）
  box(W_SOLID, -16, 0.8, 13, 8, 0.8, 0.8, C.twig, 0.5);
  box(W_SOLID, -14.5, 1.2, 14, 5, 0.7, 0.7, C.twigDark, -0.7);
  box(W_SOLID, -12.2, 1.6, 12.6, 3, 0.6, 0.6, C.twig, 1.1);

  // 小段木栅栏（远景）
  for (var i = 0; i < 7; i++) {
    var fx = -60 + i * 7;
    box(W_SOLID, fx, 2.2, -46, 1, 4.4, 1, C.fence);
    box(W_SOLID, fx, 4.6, -46, 1, 1, 1, C.fenceDark);
  }
  box(W_SOLID, -39, 3.4, -46, 44, 0.8, 0.8, C.fenceDark);
  box(W_SOLID, -39, 1.8, -46, 44, 0.8, 0.8, C.fenceDark);
  // 栅栏积雪
  for (var j = 0; j < 7; j++)
    box(W_SOLID, -60 + j * 7, 5.4, -46, 1.4, 0.8, 1.4, 0xffffff);
}

// ============================================================
//  3. 雪人本体（三颗叠起来的雪球 + 笑脸 + 帽围巾手臂）
// ============================================================
var HA = { cx: -0.8, cy: 47, cz: 1.2, rx: 7.4, ry: 7.0, rz: 7.4 };   // 头
var MA = { cx: 0.8,  cy: 30.5, cz: 0.4, r: 9.6 };                    // 中球
var BA = { cx: 0,    cy: 13, cz: 0, rx: 13.4, ry: 12.4, rz: 13.4 };  // 底球

function buildSnowBody() {
  // —— 三颗雪球：微微错位、压扁，像手工堆出来的 ——
  snowBall(S_SOLID, BA.cx, BA.cy, BA.cz, BA.rx, BA.ry, BA.rz, C.snow);
  snowBall(S_SOLID, MA.cx, MA.cy, MA.cz, MA.r, MA.r * 0.94, MA.r, C.snow);
  snowBall(S_SOLID, HA.cx, HA.cy, HA.cz, HA.rx, HA.ry, HA.rz, C.snow);

  // 交界处的"压痕"碎雪
  for (var i = 0; i < 26; i++) {
    var a = rand(0, Math.PI * 2);
    vox(S_SOLID, MA.cx + Math.cos(a) * 9.2, 21.8 + rand(-0.6, 0.6), MA.cz + Math.sin(a) * 9.2, pick(C.snow));
    var b = rand(0, Math.PI * 2);
    vox(S_SOLID, HA.cx + Math.cos(b) * 7, 40.6 + rand(-0.5, 0.5), HA.cz + Math.sin(b) * 7, pick(C.snow));
  }

  // —— 煤球纽扣 ×3 ——
  var bys = [34.5, 30.5, 26.5];
  for (var k = 0; k < 3; k++) {
    var y = bys[k];
    var z = surfZ(MA.cx, MA.cy, MA.cz, MA.r, MA.r * 0.94, MA.r, MA.cx, y) + 0.1;
    box(S_SOLID, MA.cx, y, z, 1.9, 1.9, 1.5, k === 1 ? C.coalHi : C.coal);
  }

  // —— 红围巾：绕脖一圈 + 飘带（飘带单独做动态组） ——
  var ny = 39.8;
  for (var g = 0; g < 26; g++) {
    var th = (g / 26) * Math.PI * 2;
    var rr = 4.6;
    box(S_SOLID, HA.cx + Math.cos(th) * rr, ny + Math.sin(th * 2) * 0.5, HA.cz + Math.sin(th) * rr,
        2.6, 2.4, 2.6, g % 5 === 3 ? C.scarfLight : C.scarf, -th);
  }
  box(S_SOLID, HA.cx, ny - 1.2, HA.cz + 4.4, 5, 2.8, 3.4, C.scarf);   // 前结
  box(S_SOLID, HA.cx + 0.4, ny - 1.2, HA.cz + 5.9, 2, 2, 1.6, C.scarfLight);
  // 垂下的飘带（沿中球表面）
  box(S_SOLID, HA.cx + 2.4, 36.5, HA.cz + 4.4, 2.6, 3.4, 1.6, C.scarf);
  box(S_SOLID, HA.cx + 2.8, 33.4, HA.cz + 5.2, 2.6, 3.2, 1.6, C.scarfLight);
  box(S_SOLID, HA.cx + 3.1, 30.4, HA.cz + 5.8, 2.6, 3.2, 1.6, C.scarf);
  box(S_SOLID, HA.cx + 3.3, 27.6, HA.cz + 6.2, 2.6, 2.6, 1.6, C.scarf);

  // —— 大礼帽（歪戴） ——
  var hatG = { x: HA.cx + 0.4, y: 53.2, z: HA.cz - 0.4, rz: -0.11, rx: 0.05 };
  // 用带旋转的体素摆放：帽檐/帽筒/帽带分层
  var tilt = hatG.rz;
  function hatRing(y, r, color, h) {
    for (var m = 0; m < 30; m++) {
      var th2 = (m / 30) * Math.PI * 2;
      var lx = Math.cos(th2) * r, lz = Math.sin(th2) * r;
      // 绕 z 轴小角度旋转
      var ox = lx * Math.cos(tilt) - y * Math.sin(tilt);
      var oy = lx * Math.sin(tilt) + y * Math.cos(tilt);
      box(S_SOLID, hatG.x + ox, hatG.y + oy, hatG.z + lz, 1.6, h, 1.6, color, -th2, hatG.rx, tilt);
    }
  }
  hatRing(0.2, 7.6, C.hat, 1.2);          // 帽檐
  column(S_SOLID, hatG.x, hatG.z, Math.floor(hatG.y - 1), Math.floor(hatG.y + 0.5), 7.2, C.hat);
  hatRing(2.2, 5.1, C.hatBand, 2.4);      // 红帽带
  hatRing(5.2, 5.0, C.hat, 4);            // 帽筒
  column(S_SOLID, hatG.x, hatG.z, Math.floor(hatG.y + 3), Math.floor(hatG.y + 7), 4.6, C.hatTop);
  column(S_SOLID, hatG.x, hatG.z, Math.floor(hatG.y + 6.6), Math.floor(hatG.y + 7.4), 5, C.hat); // 帽顶沿
  // 帽檐积雪
  box(S_SOLID, hatG.x - 5, hatG.y + 1.6, hatG.z + 3, 3.4, 1, 3, 0xffffff);
  box(S_SOLID, hatG.x + 5.4, hatG.y + 1.2, hatG.z - 2, 2.6, 0.9, 2.6, 0xf4faff);
}

// —— 笑脸：煤球眼（会眨）· 胡萝卜鼻 · 煤球微笑弧 · 粉腮红 ——
var blinkTargets = [];
function buildFace(snowmanGroup) {
  var eyeMat = new THREE.MeshStandardMaterial({ color: C.coal, roughness: 0.55 });
  var glintMat = new THREE.MeshBasicMaterial({ color: C.glint });
  function eye(sx) {
    var g = new THREE.Group();
    var x = HA.cx + sx * 2.9, y = HA.cy + 2.0;
    var z = surfZ(HA.cx, HA.cy, HA.cz, HA.rx, HA.ry, HA.rz, x, y) + 0.15;
    var coal = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.9, 1.5), eyeMat);
    coal.position.set(x, y, z);
    var glint = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.4), glintMat);
    glint.position.set(x + 0.5, y + 0.5, z + 0.85);
    g.add(coal, glint);
    snowmanGroup.add(g);
    blinkTargets.push(g);
  }
  eye(-1); eye(1);

  // 胡萝卜鼻：向前伸出的锥形体素
  var nz = surfZ(HA.cx, HA.cy, HA.cz, HA.rx, HA.ry, HA.rz, HA.cx, HA.cy - 0.2) - 0.2;
  var noseMats = [];
  for (var i = 0; i < 6; i++) {
    var s = 2.1 - i * 0.28;
    var m = new THREE.Mesh(new THREE.BoxGeometry(s, s, 1.35),
      new THREE.MeshStandardMaterial({ color: i % 2 ? C.carrotDark : C.carrot, roughness: 0.7 }));
    m.position.set(HA.cx, HA.cy - 0.2 - i * 0.06, nz + 0.6 + i * 1.3);
    noseMats.push(m); snowmanGroup.add(m);
  }

  // 煤球微笑：上翘弧线（嘴角高、中间低）
  var smileMat = new THREE.MeshStandardMaterial({ color: C.coal, roughness: 0.55 });
  for (var j = -3; j <= 3; j++) {
    var dx = j * 1.15;
    var x2 = HA.cx + dx;
    var y2 = HA.cy - 3.1 + 0.115 * dx * dx;       // 微笑弧
    var z2 = surfZ(HA.cx, HA.cy, HA.cz, HA.rx, HA.ry, HA.rz, x2, y2) + 0.2;
    var sm = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.05, 1.1), smileMat);
    sm.position.set(x2, y2, z2);
    snowmanGroup.add(sm);
  }
  // 嘴角小酒窝
  var dimMat = new THREE.MeshStandardMaterial({ color: C.coalHi, roughness: 0.6 });
  [-4.6, 4.6].forEach(function (dx) {
    var x3 = HA.cx + dx, y3 = HA.cy - 1.5;
    var z3 = surfZ(HA.cx, HA.cy, HA.cz, HA.rx, HA.ry, HA.rz, x3, y3) + 0.05;
    var d = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.8), dimMat);
    d.position.set(x3, y3, z3);
    snowmanGroup.add(d);
  });

  // 粉腮红
  var cheekMat = new THREE.MeshStandardMaterial({ color: C.cheek, roughness: 0.85 });
  [-1, 1].forEach(function (s2) {
    var x4 = HA.cx + s2 * 5.0, y4 = HA.cy - 1.4;
    var z4 = surfZ(HA.cx, HA.cy, HA.cz, HA.rx, HA.ry, HA.rz, x4, y4) + 0.1;
    var c = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 0.8), cheekMat);
    c.position.set(x4, y4, z4);
    snowmanGroup.add(c);
  });
}

// —— 树枝手臂：左举起来挥手（动态），右提小灯笼（动态） ——
var waveArm, lanternArm;
function twigLine(group, pts, color) {
  for (var i = 0; i < pts.length - 1; i++) {
    var a = pts[i], b = pts[i + 1];
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, mz = (a[2] + b[2]) / 2;
    var len = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
    var m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.8, 0.8),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.9 }));
    m.position.set(mx, my, mz);
    m.rotation.z = Math.atan2(b[1] - a[1], b[0] - a[0]);
    m.castShadow = true;
    group.add(m);
  }
}
function buildArms(snowmanGroup) {
  // 挥手的左臂（肩为轴心，做局部坐标）
  waveArm = new THREE.Group();
  waveArm.position.set(MA.cx + 8.4, MA.cy + 3.2, MA.cz + 0.5);
  twigLine(waveArm, [[0, 0, 0], [4.5, 3.2, 0], [8.2, 6.4, -0.4], [11, 8.8, -0.6]], C.twig);
  twigLine(waveArm, [[8.2, 6.4, -0.4], [10.4, 5.2, 1.2]], C.twigDark);   // 小枝杈
  twigLine(waveArm, [[11, 8.8, -0.6], [12.6, 9.4, 0.4]], C.twig);        // 指尖
  twigLine(waveArm, [[11, 8.8, -0.6], [11.6, 10.6, -1.2]], C.twigDark);
  snowmanGroup.add(waveArm);

  // 提灯笼的右臂（微垂）
  lanternArm = new THREE.Group();
  lanternArm.position.set(MA.cx - 8.4, MA.cy + 2.6, MA.cz + 0.5);
  twigLine(lanternArm, [[0, 0, 0], [-4, -1.6, 0.8], [-7.2, -3.6, 1.6]], C.twig);
  twigLine(lanternArm, [[-4, -1.6, 0.8], [-5.4, -0.4, 2.2]], C.twigDark);
  // 小灯笼
  var lg = new THREE.Group();
  lg.position.set(-7.2, -5.4, 1.6);
  var frame = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.8, 2.4),
    new THREE.MeshStandardMaterial({ color: C.lanternFrame, roughness: 0.8 }));
  var core = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.1, 1.7),
    new THREE.MeshBasicMaterial({ color: C.lanternGlow }));
  var cap = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.6, 2.8),
    new THREE.MeshStandardMaterial({ color: C.lanternFrame }));
  cap.position.y = 1.7;
  var hookh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.6, 0.4),
    new THREE.MeshStandardMaterial({ color: C.lanternFrame }));
  hookh.position.y = 2.7;
  lg.add(frame, core, cap, hookh);
  var lamp = new THREE.PointLight(0xffc06a, 1.1, 26, 2);
  lamp.position.set(0, 0, 0);
  lg.add(lamp);
  lanternArm.add(lg);
  snowmanGroup.add(lanternArm);
}

// —— 帽顶小知更鸟（轻轻点头） ——
var robin;
function buildRobin(snowmanGroup) {
  robin = new THREE.Group();
  robin.position.set(HA.cx - 2.5, 62.6, HA.cz + 3.2);
  var body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.9, 3),
    new THREE.MeshStandardMaterial({ color: C.robinBody, roughness: 0.8 }));
  var breast = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 1.4),
    new THREE.MeshStandardMaterial({ color: C.robinBreast, roughness: 0.8 }));
  breast.position.set(0, -0.3, 1.2);
  var head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5),
    new THREE.MeshStandardMaterial({ color: C.robinBody, roughness: 0.8 }));
  head.position.set(0, 1.3, 1);
  var beak = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.9),
    new THREE.MeshStandardMaterial({ color: C.robinBeak }));
  beak.position.set(0, 1.3, 2.1);
  var tail = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 2.2),
    new THREE.MeshStandardMaterial({ color: C.coalHi }));
  tail.position.set(0, 0.4, -2.2);
  var eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ color: 0x111111 }));
  eyeL.position.set(0.76, 1.5, 1.5);
  robin.add(body, breast, head, beak, tail, eyeL);
  robin.rotation.y = 0.5;
  snowmanGroup.add(robin);
}

// ============================================================
//  4. 飘雪（体素小方块） + 云 + 太阳
// ============================================================
var FLAKES = 520, flakeMesh, flakes = [];
function buildSnowfall() {
  flakeMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.55, 0.55, 0.55),
    new THREE.MeshLambertMaterial({ color: 0xffffff }),
    FLAKES);
  for (var i = 0; i < FLAKES; i++) {
    flakes.push({
      x: rand(-95, 95), y: rand(0, 95), z: rand(-95, 95),
      sp: rand(4, 11), ph: rand(0, 9), amp: rand(0.5, 2.2), rot: rand(0, 3), rs: rand(0.5, 2)
    });
  }
  scene.add(flakeMesh);
}
var clouds = [];
function buildSkyBits() {
  // 太阳
  var sun = new THREE.Mesh(new THREE.SphereGeometry(13, 18, 14),
    new THREE.MeshBasicMaterial({ color: C.sun }));
  sun.position.set(-160, 150, -240);
  scene.add(sun);
  // 云
  for (var i = 0; i < 5; i++) {
    var g = new THREE.Group();
    var mat = new THREE.MeshLambertMaterial({ color: C.cloud });
    for (var j = 0; j < 4; j++) {
      var m = new THREE.Mesh(new THREE.BoxGeometry(rand(9, 17), rand(3, 5), rand(6, 10)), mat);
      m.position.set(rand(-8, 8), rand(-1.5, 1.5), rand(-4, 4));
      g.add(m);
    }
    g.position.set(rand(-170, 170), rand(85, 135), rand(-150, -40));
    scene.add(g);
    clouds.push({ g: g, sp: rand(1.2, 3) });
  }
}

// ============================================================
//  5. 场景 / 灯光 / 相机
// ============================================================
var scene, camera, renderer, controls, clock, snowmanGroup, snowLight;
function createScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(C.sky);
  scene.fog = new THREE.Fog(C.fogC, 230, 560);

  camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 900);
  camera.position.set(58, 46, 108);

  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.NoToneMapping;   // 保持体素高饱和度，避免 ACES 洗色
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('app').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 32, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 35;
  controls.maxDistance = 320;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  clock = new THREE.Clock();
}
function createLights() {
  scene.add(new THREE.AmbientLight(0x9fc0e8, 0.5));
  var hemi = new THREE.HemisphereLight(0xcfe8ff, 0x7fa2c4, 0.5);
  scene.add(hemi);
  var sunL = new THREE.DirectionalLight(0xfff4e0, 1.2);
  sunL.position.set(-90, 150, 110);
  sunL.castShadow = true;
  sunL.shadow.mapSize.set(2048, 2048);
  var s = sunL.shadow.camera;
  s.left = -80; s.right = 80; s.top = 100; s.bottom = -60; s.near = 20; s.far = 420;
  sunL.shadow.bias = -0.0005;
  scene.add(sunL);
  // 雪地反光补光
  snowLight = new THREE.PointLight(0xcfe6ff, 0.35, 200, 2);
  snowLight.position.set(20, 12, 40);
  scene.add(snowLight);
}

// 把收集器烘焙成 InstancedMesh
function bake(list, material, shadows) {
  var mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), material, list.length);
  var m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  var p = new THREE.Vector3(), sV = new THREE.Vector3(), col = new THREE.Color();
  for (var i = 0; i < list.length; i++) {
    var v = list[i];
    e.set(v.rx, v.ry, v.rz); q.setFromEuler(e);
    p.set(v.x, v.y, v.z); sV.set(v.sx, v.sy, v.sz);
    m.compose(p, q, sV);
    mesh.setMatrixAt(i, m);
    col.setHex(v.color); mesh.setColorAt(i, col);
  }
  mesh.castShadow = shadows; mesh.receiveShadow = shadows;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  return mesh;
}

// ============================================================
//  6. 动画状态
// ============================================================
var shakeT = 0, blinkTimer = 2.5, blinkPhase = 0, snowing = true, snowBoost = 0;
var fpsEl, frames = 0, fpsTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  var t = clock.elapsedTime;

  // —— 雪人整体：呼吸式轻摆 + 摇一摇 ——
  var wobble = 0;
  if (shakeT > 0) {
    shakeT -= dt;
    wobble = Math.sin(t * 26) * 0.085 * Math.min(1, shakeT * 2);
    snowBoost = Math.max(snowBoost, 1);
  }
  snowmanGroup.rotation.z = Math.sin(t * 0.9) * 0.012 + wobble;
  snowmanGroup.rotation.x = Math.cos(t * 0.7) * 0.008;
  snowmanGroup.position.y = Math.sin(t * 1.5) * 0.25 + Math.abs(wobble) * 2;

  // —— 眨眼 ——
  blinkTimer -= dt;
  if (blinkTimer <= 0 && blinkPhase === 0) { blinkPhase = 0.14; blinkTimer = rand(2.4, 4.6); }
  if (blinkPhase > 0) {
    blinkPhase -= dt;
    var k = blinkPhase > 0.07 ? (0.14 - blinkPhase) / 0.07 : blinkPhase / 0.07;
    for (var b = 0; b < blinkTargets.length; b++)
      blinkTargets[b].scale.y = Math.max(0.08, k);
  } else {
    for (var b2 = 0; b2 < blinkTargets.length; b2++) blinkTargets[b2].scale.y = 1;
  }

  // —— 挥手 + 提灯晃动 ——
  waveArm.rotation.z = -0.35 + Math.sin(t * 2.6) * 0.22;
  waveArm.rotation.x = Math.sin(t * 1.3) * 0.06;
  lanternArm.rotation.z = Math.sin(t * 1.1 + 1) * 0.09;
  lanternArm.rotation.x = Math.sin(t * 0.9) * 0.05;

  // —— 知更鸟点头 ——
  robin.rotation.z = Math.sin(t * 3.1) * 0.08;
  robin.position.y = 62.6 + Math.sin(t * 2.2) * 0.18;

  // —— 飘雪 ——
  snowBoost = Math.max(0, snowBoost - dt * 0.6);
  var active = snowing || snowBoost > 0;
  flakeMesh.visible = active;
  if (active) {
    var m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), e4 = new THREE.Euler();
    var p4 = new THREE.Vector3(), s4 = new THREE.Vector3(snowBoost > 0 ? 1.4 : 1, 1, 1);
    for (var i = 0; i < FLAKES; i++) {
      var f = flakes[i];
      f.y -= f.sp * (1 + snowBoost * 1.6) * dt;
      f.x += Math.sin(t * 0.8 + f.ph) * f.amp * dt * 2;
      f.rot += f.rs * dt;
      if (f.y < -2) { f.y = rand(75, 100); f.x = rand(-95, 95); f.z = rand(-95, 95); }
      e4.set(f.rot, f.rot * 0.7, 0); q4.setFromEuler(e4);
      p4.set(f.x, f.y, f.z);
      m4.compose(p4, q4, s4);
      flakeMesh.setMatrixAt(i, m4);
    }
    flakeMesh.instanceMatrix.needsUpdate = true;
  }

  // —— 云 ——
  for (var c = 0; c < clouds.length; c++) {
    clouds[c].g.position.x += clouds[c].sp * dt;
    if (clouds[c].g.position.x > 200) clouds[c].g.position.x = -200;
  }

  controls.update();
  renderer.render(scene, camera);

  frames++; fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    if (fpsEl) fpsEl.textContent = Math.round(frames / fpsTimer) + ' FPS · ' +
      renderer.info.render.calls + ' calls · ' + (renderer.info.render.triangles / 1000).toFixed(0) + 'k tris';
    frames = 0; fpsTimer = 0;
  }
}

// ============================================================
//  7. UI
// ============================================================
function bindUI() {
  fpsEl = document.getElementById('fps');
  document.getElementById('btnShake').onclick = function () {
    shakeT = 0.9;
    for (var i = 0; i < FLAKES; i++) flakes[i].sp = rand(4, 11);
  };
  var btnSnow = document.getElementById('btnSnow');
  btnSnow.onclick = function () {
    snowing = !snowing;
    btnSnow.textContent = snowing ? '❄️ 降雪中' : '❄️ 已停雪';
    btnSnow.className = 'btn' + (snowing ? ' on' : '');
  };
  var btnSpin = document.getElementById('btnSpin');
  btnSpin.onclick = function () {
    controls.autoRotate = !controls.autoRotate;
    btnSpin.className = 'btn' + (controls.autoRotate ? ' on' : '');
  };
  document.getElementById('btnShot').onclick = function () {
    renderer.render(scene, camera);
    var a = document.createElement('a');
    a.href = renderer.domElement.toDataURL('image/png');
    a.download = 'voxel-snowman.png';
    a.click();
  };
  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// ============================================================
//  8. 启动
// ============================================================
function init() {
  if (typeof THREE === 'undefined') {
    document.getElementById('loading').innerHTML =
      '<div style="color:#c0392b;font-size:14px;letter-spacing:2px">Three.js CDN 加载失败，请联网后刷新</div>';
    return;
  }
  // 色板 sRGB→Linear 转换：Three r147 不做色彩管理，不转换会整体提亮洗色
  for (var key in C) {
    var v = C[key];
    if (typeof v === 'number') {
      C[key] = new THREE.Color(v).convertSRGBToLinear().getHex();
    } else if (Array.isArray(v)) {
      for (var vi = 0; vi < v.length; vi++)
        v[vi] = new THREE.Color(v[vi]).convertSRGBToLinear().getHex();
    }
  }
  createScene();
  createLights();

  snowmanGroup = new THREE.Group();
  scene.add(snowmanGroup);

  buildGround();
  buildTrees();
  buildProps();
  buildSnowBody();
  snowmanGroup.add(bake(S_SOLID, new THREE.MeshStandardMaterial({ roughness: 0.82, metalness: 0.02 }), true));
  buildFace(snowmanGroup);
  buildArms(snowmanGroup);
  buildRobin(snowmanGroup);
  scene.add(bake(W_SOLID, new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0.02 }), true));

  buildSnowfall();
  buildSkyBits();
  bindUI();
  animate();

  window.__stats = { snowman: S_SOLID.length, world: W_SOLID.length, ok: true };
  setTimeout(function () { document.getElementById('loading').classList.add('hide'); }, 350);
}
init();
})();
</script>
