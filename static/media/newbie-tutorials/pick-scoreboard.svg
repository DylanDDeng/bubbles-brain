<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 640" role="img" aria-labelledby="title desc">
  <title id="title">两张成绩单：干活和写代码</title>
  <desc id="desc">两张横向柱状图，数据来自本站 2026 年 10 月 4 日的模型榜单。左边 Vals Index（金融、法律、编程等真实行业任务）：Gemini 4 Argon 68.9（尚未全面开放）、Claude Sonnet 5.5 67.0、GPT-6 Astra 63.1、GLM-5.3 53.5、DeepSeek V4.1 Flash 51.3、Kimi K3 50.3、腾讯混元 Hy4 49.9、Qwen 3.8 Max 48.3。右边 DeepSWE（在真实代码库里完成多文件开发）：Claude Opus 5.5 74.2、GPT-6 Astra 74.1、Gemini 3.8 Flash 73.8、GLM-5.3 69.0、Kimi K3 68.5、DeepSeek V4 Pro 62.8、Qwen 3.8 Max 57.5。海外 Claude、GPT 在两张榜上都在最前排；国内 GLM 和 Kimi 写代码最接近第一梯队；DeepSeek 免费，综合分在图中的国产模型里仅次于 GLM。图里只放了在主流聊天 App 里用得到的模型。</desc>
  <style>
    .sans{font-family:-apple-system,'PingFang SC','Noto Sans SC',system-ui,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .eyebrow{font-size:14px;letter-spacing:4px;font-weight:700;fill:#d9341c}
    .headline{font-size:36px;font-weight:720;letter-spacing:-1px;fill:#111}
    .ptitle{font-size:20px;font-weight:720;fill:#111}
    .psub{font-size:14.5px;fill:#6c6c6c}
    .name{font-size:14.5px;font-weight:600}
    .global-t{fill:#111}
    .cn-t,.free-t{fill:#d9341c}
    .other-t{fill:#9c9c98}
    .val{font-size:14px;font-weight:600;fill:#333}
    .global{fill:#111}
    .cn{fill:#ff4d2e}
    .free{fill:#fff0ec;stroke:#ff4d2e;stroke-width:1.8}
    .other{fill:#d6d6d2}
    .key{font-size:14px;fill:#333}
    .caption{font-size:16px;font-weight:600;fill:#333}
    .bar{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media(prefers-reduced-motion:reduce){.bar{animation:none}}
  </style>
  <g class="sans">
