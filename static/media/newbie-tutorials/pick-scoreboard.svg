    <rect x="40" y="118" width="14" height="14" rx="2" class="global"/><text x="62" y="130" class="key">海外首选</text>
    <rect x="152" y="118" width="14" height="14" rx="2" class="cn"/><text x="174" y="130" class="key">国内首选</text>
    <rect x="264" y="118" width="14" height="14" rx="2" class="free"/><text x="286" y="130" class="key">免费首选</text>
    <rect x="376" y="118" width="14" height="14" rx="2" class="other"/><text x="398" y="130" class="key">其他</text>
