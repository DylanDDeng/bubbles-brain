    <line x1="40" y1="566" x2="1052" y2="566" stroke="#dedede" stroke-width="1.5"/>
    <text x="40" y="598" class="caption">海外两强在两张榜上都排最前；国内 GLM、Kimi 写代码离第一梯队最近</text>
