name = "bubble-ai-news"
main = "index.ts"
compatibility_date = "2026-07-15"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "news-api.bubblenews.today", custom_domain = true }
]

# Created once with `npx wrangler kv namespace create bubble-ai-news`; paste the id it prints.
kv_namespaces = [
  { binding = "NEWS", id = "9acf30d2336846d78f573d91fb5b4a45" }
]

# Covers the bot attaches in 封面, copied from Feishu once and served from /v1/cover/<file token>.
r2_buckets = [
  { binding = "COVERS", bucket_name = "bubble-ai-news-covers" },
  # Every story the feed has shown, one JSON file per Beijing month (archive.ts), served from /v1/archive/<YYYY-MM>.
  { binding = "ARCHIVE", bucket_name = "bubble-ai-news-archive" }
]

# Shrinks those covers to 800px WebP (Cloudflare Images; the free tier covers a few thousand a month).
[images]
binding = "IMAGES"

# The bot asks for a sync (POST /v1/sync) after each batch it writes. The half-hourly run is only
# the safety net for a missed call or a hand edit in the Base, and keeps Feishu API use low.
[triggers]
crons = ["7,37 * * * *"]

# Workers Logs: each sync logs who triggered it, what Feishu returned and whether the feed changed.
[observability]
enabled = true

[vars]
# https://qxs9ymhwwgc.feishu.cn/base/VeAHb1KBJaC376sPK9kcqWtKnIh, table 选题
FEISHU_BASE_TOKEN = "VeAHb1KBJaC376sPK9kcqWtKnIh"
FEISHU_TABLE_ID = "tbllnXUeB6wHLgBJ"
COVER_BASE_URL = "https://news-api.bubblenews.today/v1/cover/"

# Secrets (wrangler secret put … --config workers/ai-news/wrangler.toml):
#   FEISHU_APP_ID, FEISHU_APP_SECRET — a Feishu custom app with bitable:app:readonly (app identity),
#   added to the Base as a collaborator.
#   SYNC_TOKEN — random string shared with the Grok bot for POST /v1/sync.
